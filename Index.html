'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:true});/* pas de willReadFrequently : le jeu ne relit jamais ce canvas, et cette option force un rendu logiciel (CPU) très lent */let W=0,H=0,dpr=1;// Mode pixel art : on dessine dans un canvas PX fois plus petit, agrandi sans lissage (P pour basculer).
const initialPixelZoom=()=>Math.max(1,Math.max(2,Math.round(innerWidth/640))-1);
let PIXEL=true,PX=initialPixelZoom();function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;const k=dpr;canvas.width=Math.ceil(W*k);canvas.height=Math.ceil(H*k);ctx.setTransform(k,0,0,k,0,0);ctx.imageSmoothingEnabled=!PIXEL;canvas.style.imageRendering=PX>1?'pixelated':'auto';if(DECOR_CACHE.ready)warmDecorCache()}addEventListener('resize',resize);resize();
let cam={x:0,z:-148,zoom:.9};const Z=()=>PIXEL?8*PX/.86:Math.min(W/83,H/54)*cam.zoom;const YK=()=>PIXEL?.43:.42;/* Vue de dessus en 3/4 : x vers la droite, z (sud) vers le bas, la hauteur monte à l'écran. */function project(x,y,z){let s=Z();return {x:W/2+(x-cam.x)*s*.86,y:H*.45+(z-cam.z)*s*.86-y*s*.96}}function groundFromScreen(sx,sy){let s=Z();return{x:(sx-W/2)/(s*.86)+cam.x,z:(sy-H*.45)/(s*.86)+cam.z}}
const random=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let units=[],enemies=[],effects=[],particles=[],wave=0,coreHP=100,selected=[],currentTime=0,spawnQueue=[],nextWave=0,ended=false,noticeEnd=0,last=null,freeze=0;const core={x:0,z:-154};let uid=0;const clampWorld=p=>{p.x=clamp(p.x,WORLD.x0+8,WORLD.x1-8);p.z=clamp(p.z,WORLD.z0+8,WORLD.z1-6);pushOutOfRock(p)};
function poly(points,color,stroke=null){ctx.beginPath();points.forEach((p,i)=>{let q=project(...p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function box3(x,z,dx,dz,height,top,side,front){let a=x-dx/2,b=x+dx/2,c=z-dz/2,d=z+dz/2;poly([[a,0,c],[b,0,c],[b,height,c],[a,height,c]],side);poly([[b,0,c],[b,0,d],[b,height,d],[b,height,c]],front);poly([[a,height,c],[b,height,c],[b,height,d],[a,height,d]],top)}
function circle3(x,z,r,color,y=0){let p=project(x,y,z);ctx.beginPath();ctx.ellipse(p.x,p.y,r*Z()*.9,r*Z()*.42,-.02,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function line3(a,b,color,width=2){let p=project(...a),q=project(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
function sphere3(x,y,z,r,color){let p=project(x,y,z),sz=r*Z();let g=ctx.createRadialGradient(p.x-sz*.3,p.y-sz*.35,1,p.x,p.y,sz);g.addColorStop(0,'#f2f3eb');g.addColorStop(.15,color);g.addColorStop(1,'#090c14');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill()}
/* Grotte sous la montagne : salle de départ fermée de parois rocheuses, un seul couloir ouvert au sud vers la jungle.
   Nord = z négatif. Rangée nord (ouest → est) : Indra, Sigil, Baliste, Portail exilé, Baliste, Medeina, Aether. */
const CAVE={x0:-56,x1:56,z0:-168,z1:-96,gate:7,wall:4};
const mountainEdge=x=>-78+4*Math.sin(x*.13)+3*Math.sin(x*.31+1);
// Contour naturel de la salle : parois ondulées, coins arrondis ; le fond nord reste droit derrière la rangée des portails
// et la zone constructible (|x|<48, -144<z<-98) reste toujours dégagée.
const caveW=z=>-59+4*Math.sin(z*.17)+2*Math.sin(z*.41+1),caveE=z=>59+4*Math.sin(z*.19+2)+2*Math.sin(z*.37+.5);
const caveN=x=>{const a=Math.abs(x);return a<48?CAVE.z0:CAVE.z0+(a-48)**1.25*.7+Math.sin(x*.6)};
const caveS=x=>{const a=Math.abs(x);return a<CAVE.gate+3?CAVE.z1:-93+3*Math.sin(x*.15)+2*Math.sin(x*.37)-Math.max(0,a-48)*.7};
const inCave=(x,z)=>z>caveN(x)&&z<caveS(x)&&x>caveW(z)&&x<caveE(z);
const inTunnel=(x,z)=>Math.abs(x)<CAVE.gate&&z>=CAVE.z1-.5&&z<mountainEdge(x)+.5;
const walkable=(x,z)=>z>=mountainEdge(x)||inCave(x,z)||inTunnel(x,z)||isDug(x,z)||isGalleryOpen(x,z);
const inPath=(x,z)=>Math.abs(x)<5&&z>mountainEdge(x)-1;
// Repousse un point hors de la roche vers la zone praticable la plus proche (salle, couloir ou dehors).
function intoCave(p){const q={x:clamp(p.x,-64,64),z:clamp(p.z,CAVE.z0+.35,-88)};for(let i=0;i<80&&!inCave(q.x,q.z);i++){const dx=-q.x,dz=-130-q.z,l=Math.hypot(dx,dz)||1;q.x+=dx/l*.4;q.z+=dz/l*.4}return q}
// Repousse d'abord vers le sol praticable le plus proche (quelques unités au plus), sinon vers la salle, le couloir ou la jungle.
function pushOutOfRock(p){if(walkable(p.x,p.z))return p;for(let r=.3;r<=4.2;r+=.3)for(let a=0;a<6.28;a+=.45){const x=p.x+Math.cos(a)*r,z=p.z+Math.sin(a)*r;if(walkable(x,z)){p.x=x;p.z=z;return p}}const m=.35,c=[
 intoCave(p),
 {x:clamp(p.x,-CAVE.gate+m,CAVE.gate-m),z:clamp(p.z,CAVE.z1-.4,mountainEdge(0))},
 {x:p.x,z:mountainEdge(p.x)+.05}];let best=c[0],d=1e9;for(const q of c){const nd=Math.hypot(q.x-p.x,q.z-p.z);if(nd<d){d=nd;best=q}}p.x=best.x;p.z=best.z;return p}
const DEITY_PORTALS=[{id:'indra',name:'Indra',x:-41,active:false},{id:'sigil',name:'Sigil',x:-24,active:false},{id:'medeina',name:'Medeina',x:24,active:false},{id:'aether',name:'Aether',x:41,active:false}];
const trees=[];let seed=19653;function seeded(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}for(let i=0;i<6600;i++){let x=(seeded()-.5)*448,z=-170+seeded()*240;if(z<mountainEdge(x)+3||Math.abs(x)<8||Math.abs(Math.abs(x)-11)<7&&Math.abs(z+66)<11)continue;trees.push({x,z,h:random(2.1,5.5),r:random(.8,1.8)})}const stones=[];for(let i=0;i<2600;i++){let x=(seeded()-.5)*446,z=-168+seeded()*236;if(z<mountainEdge(x)+2||Math.abs(x)<6)continue;stones.push({x,z,w:.5+seeded()*1.5})}
function soldier(name,x,z,role,squad=0){let u={id:uid++,name,x,z,tx:x,tz:z,hp:role==='paladin'?180:role==='healer'?115:role==='shooter'?110:role==='engineer'?140:82,max:role==='paladin'?180:role==='healer'?115:role==='shooter'?110:role==='engineer'?140:82,role,squad,attack:0,ability:0,stance:'attack',radius:role==='paladin'?.85:.55,level:1,xp:0};units.push(u);return u}
function init(){closeCharacterDialogue();fireWalls=[];if(init.ran){generateGalleries();resetBlocks();buildPixelWorld();if(decorRenderer)useCanvasDecor();if(HUD.els)buildMiniMap()}else resetBlocks();init.ran=true;resetBuildings();resetResources();resetTurrets();uid=0;units=[];PORTAL.start=0;enemies=[];effects=[];particles=[];wave=0;document.getElementById('wave').textContent='—';coreHP=100;selected=[];currentTime=0;spawnQueue=[];nextWave=0;ended=false;freeze=0;cam={x:0,z:-148,zoom:.9};resetOrb();/* héros mis de côté pour une intégration ultérieure : soldier('Paladin',-2.5,13,'paladin');soldier('Soigneur',1,15,'healer');soldier('Tireur',3,12,'shooter'); */soldier('Ingénieur Exilé',PORTAL.x,PORTAL.z+.8,'engineer').hidden=true;selected=[units[0]];HUD.anchor=false;HUD.mode=null;HUD.menu=null;HUD.building=null;HUD.buildType=null;last=null;document.getElementById('banner').style.display='none';renderRoster();say('L’Ancre s’est éteinte. Sélectionnez l’Ingénieur, puis clic droit sur l’Ancre (ou R) pour la réactiver.',7)}
function startWave(){wave++;document.getElementById('wave').textContent=String(wave);let n=4+wave*3;spawnQueue=[];for(let i=0;i<n;i++)spawnQueue.push({at:currentTime+2+i*Math.max(.35,1.5-wave*.14),x:i%2===0?-2:2,kind:i%5===4?'brute':i%6===3?'spitter':'creep'});say('Assaut '+wave+' : des créatures remontent la jungle par le sud.',3)}
function spawn(s){let k=s.kind;enemies.push({x:s.x+random(-1.6,1.6),z:62+random(0,4),hp:k==='brute'?110:k==='spitter'?48:35,max:k==='brute'?110:k==='spitter'?48:35,speed:k==='brute'?1.4:k==='spitter'?2:2.7,range:k==='spitter'?9:1.5,damage:k==='brute'?12:k==='spitter'?5:6,kind:k,cooldown:random(.3,1),target:null})}
function say(s,seconds=2){let e=document.getElementById('notice');e.textContent=s;e.style.opacity=1;noticeEnd=currentTime+seconds}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}function targetClosest(source,list,range=1e9){let best=null,d=range;for(const t of list){if(t.hp<=0||t.hidden)continue;let nd=dist(t,source);if(nd<d){d=nd;best=t}}return best}
function move(u,t,dt,mult=1){let dx=t.x-u.x,dz=t.z-u.z,d=Math.hypot(dx,dz);if(d<.24)return;let speed=(u.role==='guard'?3.45:isAdept(u)?7.6:15.2)*mult;let step=Math.min(d,speed*dt),nx=u.x+dx/d*step,nz=u.z+dz/d*step;if(walkable(nx,nz)){u.x=nx;u.z=nz}else if(walkable(nx,u.z))u.x=nx;else if(walkable(u.x,nz))u.z=nz;clampWorld(u)}
// src : unité à l'origine des dégâts ; elle gagne l'expérience du monstre qu'elle achève
function damage(t,amount,src){const was=t.hp;t.hp=Math.max(0,t.hp-amount);if(t===core)coreHP=Math.max(0,coreHP-amount);if(src&&t.kind&&was>0&&t.hp<=0)gainXP(src,KILL_XP[t.kind]||10)}function flash(x,z,color){effects.push({x,z,age:0,duration:.22,type:'hit',color})}function blast(a,b,color){effects.push({x:a.x,z:a.z,tx:b.x,tz:b.z,age:0,duration:.13,type:'laser',color})}function zone(x,z,r,color){effects.push({x,z,r,age:0,duration:1,type:'zone',color})}
function ability(){let source=selected.find(u=>u.hp>0&&u.role!=='guard')||selected[0];if(!source)return;if(source.role==='engineer'&&!ORB.active){orderOrb(source);return}if(source.ability>0){say('Compétence en recharge.',1);return}if(source.role==='paladin'){source.ability=16;zone(source.x,source.z,5,'#f1d28c');for(let e of enemies)if(dist(e,source)<5)damage(e,35+lvlBonus(source),source);for(let u of units)if(dist(u,source)<5)u.shield=7;say('PALADIN — Égide : boucliers renforcés.',2)}else if(source.role==='healer'){source.ability=12;zone(source.x,source.z,7,'#83e5bf');for(let u of units)if(dist(u,source)<7){u.hp=Math.min(u.max,u.hp+55);if(u.hp<=0)u.hp=25}say('SOIGNEUR — Restauration de zone.',2)}else if(source.role==='engineer'){source.ability=18;coreHP=Math.min(100,coreHP+15);zone(core.x,core.z,4,'#ffb03c');say('INGÉNIEUR EXILÉ — Réparation de l’Ancre.',2)}else if(source.role==='shooter'){source.ability=10;let t=targetClosest(source,enemies,18);if(t){damage(t,95+lvlBonus(source),source);blast(source,t,'#f7e7a2');flash(t.x,t.z,'#f7e7a2')}say('TIREUR — Tir de précision.',2)}else{source.ability=14;zone(source.x,source.z,7,'#a1badb');for(let u of units)if(u.squad===source.squad)u.buff=8;say('DISCIPLES D’INDRA — Discipline martiale.',2)}}
function update(dt){currentTime+=dt;portalTick();if(noticeEnd<currentTime)document.getElementById('notice').style.opacity=0;if(ended)return;updateBuildings(dt);updateAdepts(dt);updateEvilPortals();for(const u of units){u.attack-=dt;u.ability=Math.max(0,u.ability-dt);u.shield=Math.max(0,(u.shield||0)-dt);u.buff=Math.max(0,(u.buff||0)-dt)}while(spawnQueue.length&&spawnQueue[0].at<=currentTime)spawn(spawnQueue.shift());let alive=units.filter(u=>u.hp>0);for(let u of alive){if(u.forceMove&&Math.hypot(u.x-u.tx,u.z-u.tz)<.6)u.forceMove=false;let enemy=u.forceMove?null:u.hidden||u.role==='engineer'&&(u.job||u.buildJob||u.orbJob||u.turretJob)||isAdept(u)&&u.job?null:targetClosest(u,enemies,FIGHT[u.role]?FIGHT[u.role].seek:u.role==='paladin'?3:u.role==='healer'?9:u.role==='shooter'?20:10);if(u.role==='archer'&&archerTick(u,enemy,dt))continue;if(u.stance!=='hold'&&enemy){let reach=FIGHT[u.role]?FIGHT[u.role].reach:u.role==='paladin'?2.2:u.role==='shooter'?17.2:8.6;/* portée de l'arbalète doublée */if(dist(u,enemy)>reach)move(u,steer(u,enemy),dt,.65);if(dist(u,enemy)<reach&&u.attack<=0&&FIGHT[u.role])barracksStrike(u,enemy);else if(dist(u,enemy)<reach&&u.attack<=0){let dmg=(u.role==='paladin'?30:u.role==='shooter'?19:u.role==='healer'?9:12)+lvlBonus(u);if(u.buff>0)dmg*=1.5;damage(enemy,dmg,u);if(u.role!=='paladin')(u.role==='guard'||u.role==='indra'?arrow(u,enemy):u.role==='shooter'&&PIXEL?volley(u,enemy):u.role==='engineer'?rivet(u,enemy):blast(u,enemy,u.role==='shooter'?'#f4d780':'#bed7df'));else{flash(enemy.x,enemy.z,'#f0dba4');swordStrike(u,enemy)}u.attack=u.role==='paladin'?.88:u.role==='shooter'?.78:u.role==='indra'?.55:1.15}}else if(u.stance!=='hold')move(u,steer(u,{x:u.tx,z:u.tz}),dt);if(u.role==='healer'&&u.attack<=0){let target=alive.filter(t=>t.hp<t.max*.75&&dist(t,u)<8).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(target){target.hp=Math.min(target.max,target.hp+10);u.attack=1;zone(target.x,target.z,.9,'#80ddb8')}}}
updateTurrets(dt);
for(let e of enemies){if(e.hp<=0)continue;if(e.stun>0){e.stun-=dt;continue}const espd=e.speed*(e.slowUntil>currentTime?SILLON.slow:1);e.cooldown-=dt;let target=targetClosest(e,alive,4.5)||core;let d=dist(e,target);if(d>e.range){const s=steer(e,target),dx=s.x-e.x,dz=s.z-e.z,l=Math.hypot(dx,dz)||1;e.x+=dx/l*espd*dt;e.z+=dz/l*espd*dt;clampWorld(e)}else if(e.cooldown<=0){let dmg=e.damage;if(target!==core){if(target.shield>0)dmg*=.35;if(FIGHT[target.role]&&FIGHT[target.role].guard)dmg*=FIGHT[target.role].guard;damage(target,afterArmor(target,dmg))}else coreHP=Math.max(0,coreHP-dmg);flash(target.x,target.z,'#e17b63');if(e.kind==='spitter')blast(e,target,'#c88f9e');e.cooldown=e.kind==='brute'?1.7:1.15}}
