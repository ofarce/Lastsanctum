<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unités pixel art — affinage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b120e;--card:#141c17;--line:#2a3a2e;--txt:#e3e6d4;--mut:#9fb09e;--acc:#d8c26a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 'Pixelify Sans',system-ui,sans-serif}
header,section{max-width:1400px;margin:auto;padding:0 16px}header{padding-top:18px}h1{margin:0;font-weight:600;letter-spacing:.08em;font-size:24px;color:var(--acc)}header p{color:var(--mut);margin:4px 0 0}
h2{font-weight:600;font-size:20px;margin:22px 0 8px;letter-spacing:.06em}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card .art{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:10px 6px 4px;background:radial-gradient(ellipse at 50% 85%,#22322a,#0f1813)}
.card canvas{image-rendering:pixelated;display:block}
.b{padding:8px 12px 12px}.b h3{margin:0;font-size:16px;color:var(--acc);font-weight:600}.b p{margin:3px 0 0;color:#c8cdbb;font-size:13px}
</style></head><body>
<header><h1>UNITÉS · AFFINAGE DES BASES RETENUES</h1><p>Bases : Paladin 2 (Gardien Saurus), Soigneur 3 (Prêtre de l’Ancre), Indra 3 (Archers). Sprites natifs 80×84, ×3 ; vignettes ×1 et ×2. Les lueurs sont animées.</p></header>
<main id="main"></main>
<script src="assets/decor.js?v=2"></script>
<script src="assets/units.js?v=1"></script>
<script>
'use strict';
const{figure,UNITS,TIREUR}=UnitKit;
const main=document.getElementById('main'),cards=[];
for(const u of UNITS){const sec=document.createElement('section');sec.innerHTML=`<h2>${u.title}</h2><div class="row"></div>`;main.appendChild(sec);
 for(const p of u.list){const card=document.createElement('div');card.className='card';const art=document.createElement('div');art.className='art';const cv=[];
  for(const k of[3,1,2]){const b=document.createElement('canvas');b.width=80*k;b.height=84*k;art.appendChild(b);cv.push([b,k])}
  card.appendChild(art);card.insertAdjacentHTML('beforeend',`<div class="b"><h3>${p.name}</h3><p>${p.desc}</p></div>`);sec.querySelector('.row').appendChild(card);cards.push({p,cv})}}
function paint(t){for(const{p,cv}of cards){const c=figure(p.s,t);for(const[b,k]of cv){const g=b.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,b.width,b.height);g.drawImage(c,0,0,b.width,b.height)}}}
paint(0);let last=0;(function loop(now){requestAnimationFrame(loop);if(now-last<110)return;last=now;paint(now/1000)})(0);
</script></body></html>
