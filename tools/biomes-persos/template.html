<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Sans:wght@400;500;700&display=swap">
<style>
/* Mise en page : barre de réglages collante, puis une section par élément = cinq modèles animés côte à côte, puis la rangée à l'échelle du jeu. Un seul aspect, sombre comme la caverne. */
:root{
  --bg:#0d1114; --panel:#141c21; --line:#27363d; --ink:#e6e0c8; --muted:#93a3a4;
  --acc:#9fe0c0; --acc-dim:#3d6a58; --warn:#e58a5a;
  --display:"VT323","Courier New",monospace; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{padding-block:26px 16px}
h1{font:400 clamp(34px,5vw,46px)/1 var(--display);margin:0 0 8px;color:var(--acc);letter-spacing:.03em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:72ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-block:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:9px}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp>span{font:400 17px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.spacer{flex:1}
button{font:500 14px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc-dim)}
button[aria-pressed="true"]{background:var(--acc);color:#0a1a14;border-color:var(--acc)}
button.main{background:var(--acc);color:#0a1a14;border-color:var(--acc);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{display:flex;flex-direction:column;gap:46px;padding-block:28px 60px}
section>h2{font:400 32px/1.05 var(--display);margin:0 0 4px;letter-spacing:.03em;color:var(--acc)}
section>p.sub{margin:0 0 16px;color:var(--muted);max-width:74ch}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.card canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid var(--line);border-radius:3px}
.card h3{font:700 17px/1.2 var(--body);margin:0}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
label.pick{display:flex;gap:7px;align-items:center;cursor:pointer;font-weight:500;margin-top:auto;padding-top:4px}
label.pick input{accent-color:var(--acc);width:17px;height:17px}
.note{border-left:2px solid var(--warn);padding-left:12px;margin:16px 0 0;max-width:74ch;color:var(--muted)}
.note b{color:var(--ink)}
.scale{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:#0c0f0e;scrollbar-color:var(--line) transparent}
.scale canvas{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
.cap{font-size:14px;color:var(--muted);margin:8px 0 0}
#out{width:100%;margin-top:10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px;font:15px var(--body);resize:vertical}
</style>

<header class="top"><div class="wrap">
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="grp" id="anim"><span>Animation</span>__ANIMS__</div>
  <div class="grp" id="sol"><span>Fond</span><button data-v="ardoise" aria-pressed="true">Ardoise</button><button data-v="nuit">Nuit</button>__SOLS__</div>
  <span class="spacer"></span>
  <button id="pause" aria-pressed="false">Pause</button>
  <button id="copy" class="main">Copier mon choix</button>
</div></div>

<main class="wrap" id="main">
<section id="echelle">
  <h2>À l’échelle du jeu</h2>
  <p class="sub">__SCALE_SUB__</p>
  <div class="scale"><canvas id="scale"></canvas></div>
  <p class="cap" id="cap"></p>
  <textarea id="out" rows="2" readonly hidden aria-label="Choix à copier"></textarea>
</section>
</main>

<script>
/*DRAW*/
</script>
<script>
'use strict';
const CFG = __CFG__;
const API = window[CFG.api] || eval(CFG.api);
const GROUND = {ardoise:["#333a46", "#3b434f", "#2b313c"], nuit:["#333a46", "#3b434f", "#2b313c"], eau:["#1f4a4a", "#2a5c58", "#183c3e"], cuivre:["#3a4a44", "#46584e", "#2e3c38"]};
function ground(g, w, h, kind){
  const [a, b, c] = GROUND[kind]; g.fillStyle = a; g.fillRect(0, 0, w, h);
  let r = 7; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < w * h / 26; i++){ g.fillStyle = rnd() < .5 ? b : c; g.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * h), rnd() < .3 ? 2 : 1, 1); }
}
function night(g, w, h){ g.globalCompositeOperation = "multiply"; g.fillStyle = "#6a78b4"; g.fillRect(0, 0, w, h); g.globalCompositeOperation = "source-over"; }
function shadow(g, x, y, rx){ g.save(); g.translate(x, y); g.scale(1, .36); g.beginPath(); g.arc(0, 0, rx, 0, 7); g.fillStyle = "rgba(8,14,14,.5)"; g.fill(); g.restore(); }
function seg(id){
  const el = document.getElementById(id); let v = el.querySelector('[aria-pressed="true"]').dataset.v;
  el.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); v = b.dataset.v; });
  return () => v;
}
const anim = seg("anim"), sol = seg("sol");
const main = document.getElementById("main"), ech = document.getElementById("echelle"), cards = [];
for (const U of API.ROLES){
  const S = API.sizeOf ? API.sizeOf(U.key) : API.SIZE, T = CFG.text[U.key] || {};
  const sec = document.createElement("section");
  sec.innerHTML = `<h2></h2><p class="sub"></p><div class="row"></div>` + (T.note ? `<p class="note"></p>` : "");
  sec.querySelector("h2").textContent = U.name; sec.querySelector(".sub").textContent = T.sub || "";
  if (T.note) sec.querySelector(".note").innerHTML = T.note;
  const row = sec.querySelector(".row"); main.insertBefore(sec, ech);
  U.list.forEach((V, vi) => {
    const card = document.createElement("div"); card.className = "card";
    const c = document.createElement("canvas"); c.width = S.w; c.height = S.h;
    const h = document.createElement("h3"); h.textContent = V.id + " · " + V.name;
    const p = document.createElement("p"); p.textContent = V.desc;
    const l = document.createElement("label"); l.className = "pick";
    l.innerHTML = `<input type="radio" name="${U.key}" value="${V.id}">Je retiens le ${V.id}`;
    card.append(c, h, p, l); row.append(card);
    const g = c.getContext("2d"); g.imageSmoothingEnabled = false; cards.push({U, vi, g, S});
  });
}
function drawUnit(g, U, vi, a, t, x, y){
  const S = API.sizeOf ? API.sizeOf(U.key) : API.SIZE, f = API.frame(U.key, vi, a, t);
  g.drawImage(f.c, x - S.ax, y - S.ay); return () => g.drawImage(f.fx, x - S.ax, y - S.ay);
}
function paint(t){
  const a = anim(), k = sol();
  for (const {U, vi, g, S} of cards){
    ground(g, S.w, S.h, k === "nuit" ? "nuit" : (U.ground && k === "ardoise" ? U.ground : k));
    if (!U.noShadow) shadow(g, S.ax, S.ay, S.sh || 8);
    const fx = drawUnit(g, U, vi, a, t, S.ax, S.ay);
    if (k === "nuit") night(g, S.w, S.h);
    fx();
  }
  const sc = document.getElementById("scale"), W = CFG.scaleW, H = CFG.scaleH, g = sc.getContext("2d"), gy = H - 8;
  if (sc.width !== W){ sc.width = W; sc.height = H; sc.style.width = W * 2 + "px"; sc.style.height = H * 2 + "px"; }
  g.imageSmoothingEnabled = false; ground(g, W, H, k === "nuit" ? "nuit" : "ardoise");
  let x = 16; const late = [];
  for (const kk of CFG.refs){ shadow(g, x, gy, 7); g.drawImage(render(fig({k:kk, dir:"s"}), 1), x - 20, gy - 33); x += 22; }
  x += 10;
  for (const U of API.ROLES){ const S = API.sizeOf ? API.sizeOf(U.key) : API.SIZE;
    U.list.forEach((V, i) => { x += S.gap || 13; if (U.ground === "eau"){ g.fillStyle = "#1f4a4a"; g.beginPath(); g.ellipse(x, gy + 1, (S.gap || 13) - 1, 7, 0, 0, 7); g.fill(); } if (!U.noShadow) shadow(g, x, gy, S.sh || 8); late.push(drawUnit(g, U, i, U.scaleAnim || "idle", t + i * .4, x, gy)); x += S.gap || 13; }); x += 12; }
  if (k === "nuit") night(g, W, H);
  late.forEach(f => f());
}
document.getElementById("cap").textContent = CFG.cap;
let paused = matchMedia("(prefers-reduced-motion: reduce)").matches, clock = 0, last = 0, acc = 0;
const pb = document.getElementById("pause");
const setPause = p => { paused = p; pb.setAttribute("aria-pressed", p); pb.textContent = p ? "Lecture" : "Pause"; };
pb.addEventListener("click", () => setPause(!paused));
// 24 images par seconde, comme les atlas du jeu
function loop(now){ const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt; if (acc >= 1 / 24){ if (!paused) clock += acc; acc = 0; paint(clock); } requestAnimationFrame(loop); }
const Q = new URLSearchParams(location.search);
if (Q.get("anim")) document.querySelector(`#anim [data-v="${Q.get("anim")}"]`)?.click();
if (Q.get("sol")) document.querySelector(`#sol [data-v="${Q.get("sol")}"]`)?.click();
if (Q.get("t")) { clock = +Q.get("t"); paused = true; }
setPause(paused); paint(clock); requestAnimationFrame(n => { last = n; loop(n); });

const radios = [...document.querySelectorAll('input[type="radio"]')];
try { const s = JSON.parse(localStorage.getItem(CFG.store) || "{}"); radios.forEach(r => { if (s[r.name] === r.value) r.checked = true; }); } catch (e) {}
const picked = () => { const o = {}; radios.forEach(r => { if (r.checked) o[r.name] = r.value; }); return o; };
radios.forEach(r => r.addEventListener("change", () => { try { localStorage.setItem(CFG.store, JSON.stringify(picked())); } catch (e) {} }));
document.getElementById("copy").addEventListener("click", e => {
  const o = picked(), parts = API.ROLES.filter(U => o[U.key]).map(U => U.name + " " + o[U.key]);
  const text = parts.length ? "Mon choix : " + parts.join(", ") + "." : "Aucun modèle choisi pour l’instant.";
  const out = document.getElementById("out"); out.value = text;
  const done = () => { e.target.textContent = "Copié"; setTimeout(() => e.target.textContent = "Copier mon choix", 1600); };
  const fallback = () => { out.hidden = false; out.scrollIntoView({block: "center"}); out.select(); };
  if (!parts.length) return fallback();
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
});
</script>
