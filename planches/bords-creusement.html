<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bords de creusement</title>
<style>
body{background:#14161c;color:#ccd;font:14px system-ui;margin:24px}
h1{font-size:18px}.row{display:flex;flex-wrap:wrap;gap:24px}
figure{margin:0}figcaption{margin-top:8px;max-width:384px;line-height:1.4}
canvas{image-rendering:pixelated;width:384px;height:288px;border:1px solid #333}
b{color:#fff}
</style></head><body>
<h1>Bords sombres des cases creusées (cases de 32 px, zoom ×3)</h1>
<div class="row">
<figure><canvas id="a" width="128" height="96"></canvas><figcaption><b>Actuel</b> : les bandes de 2 px restent entre deux cases creusées.</figcaption></figure>
<figure><canvas id="b" width="128" height="96"></canvas><figcaption><b>Option 1, voisines repeintes</b> : l'ombre ne reste que contre la roche.</figcaption></figure>
<figure><canvas id="c" width="128" height="96"></canvas><figcaption><b>Option 2, sans assombrissement</b> : sol uniforme, pas d'ombre contre la roche.</figcaption></figure>
</div>
<script>
const T=32;
// Cases creusées (i,j), dans l'ordre du creusement : un couloir puis un coude.
const dig=[[0,1],[1,1],[2,1],[3,1],[2,2],[3,2],[3,0]];
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function draw(id,mode){
  const g=document.getElementById(id).getContext('2d');
  const r=rnd(7);
  for(let y=0;y<96;y++)for(let x=0;x<128;x++){const v=40+r()*14;g.fillStyle=`rgb(${v},${v+4},${v+14})`;g.fillRect(x,y,1,1)}
  const dug=new Set();
  const isDug=(i,j)=>dug.has(i+','+j);
  const dark=(x,y,w,h)=>{g.fillStyle='#0008';g.fillRect(x,y,w,h)};
  function paint(i,j){
    const r2=rnd(1000+i*31+j*17);
    for(let y=0;y<T;y++)for(let x=0;x<T;x++){const q=r2();
      g.fillStyle=q<.12?'#5a6070':`rgb(${100+q*20|0},${78+q*14|0},${52+q*10|0})`;g.fillRect(i*T+x,j*T+y,1,1)}
    if(mode==='none')return;
    const px=i*T,py=j*T;
    if(!isDug(i-1,j))dark(px,py,2,T);
    if(!isDug(i+1,j))dark(px+30,py,2,T);
    if(!isDug(i,j+1))dark(px,py+30,T,2);
  }
  for(const [i,j] of dig){
    dug.add(i+','+j);paint(i,j);
    if(mode==='repaint')for(const [di,dj] of [[-1,0],[1,0],[0,-1],[0,1]])if(isDug(i+di,j+dj))paint(i+di,j+dj);
  }
}
draw('a','current');draw('b','repaint');draw('c','none');
</script></body></html>
