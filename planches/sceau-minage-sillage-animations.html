<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sillage argenté · 5 animations</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1117;color:#e1d8bb;font:16px/1.5 system-ui}main{max-width:1550px;margin:auto;padding:28px}h1{font-size:27px;margin:0}p,small{color:#a8b7c0}button{padding:9px 16px;background:#202c37;color:#e1d8bb;border:1px solid #536575;cursor:pointer}button[aria-pressed=true]{border-color:#e1d8bb}.bar{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}article{background:#141d25;border:1px solid #394652;padding:16px}h2{font-size:21px;margin:0 0 12px}canvas{display:block;width:100%;image-rendering:pixelated}.real{width:180px;margin:8px auto}article p{min-height:66px;font-size:14px}.note{padding:22px;border:1px solid #394652;color:#a8b7c0}.note b{color:#e1d8bb}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style><main><h1>SILLAGE ARGENTÉ · CINQ ANIMATIONS</h1><p>Piste 05 retenue · Trois petites sphères derrière l’épaule, même matière et même taille. Les cinq boucles tournent ensemble pour comparer leur mouvement.</p><div class="bar"><button id="pause">Pause</button><button id="reset">Recommencer</button><button id="slow" aria-pressed="false">Ralenti ×0,5</button></div><div class="grid" id="grid"></div></main><script>
'use strict';
const variants=[
 ['Respiration argentée','Un flottement vertical très lent, décalé d’une sphère à l’autre. Le sillage reste stable et discret.','Boucle 4 s · amplitude 2 px'],
 ['Vague descendante','Une vague passe de l’épaule vers la dernière sphère. Le mouvement se propage le long de l’arc.','Boucle 2,8 s · amplitude 3 px'],
 ['Balancier suspendu','Les sphères se balancent ensemble autour de l’épaule, comme un mobile en apesanteur.','Boucle 3,6 s · arc ±9°'],
 ['Sillage élastique','Le groupe s’écarte puis revient en place, avec un retard croissant et un léger rebond.','Boucle 4 s · recul maximal 6 px'],
 ['Ronde en cascade','Les trois sphères circulent sur une petite ellipse derrière l’épaule ; chacune prend la place de la suivante.','Tour complet 5 s · mouvement continu']
];
const grid=document.getElementById('grid'),img=new Image();img.src='assets/sceau-spheres/contexte.png';let running=true,time=0,last=0,speed=1;const views=[];
variants.forEach(([name,desc,detail],i)=>{const el=document.createElement('article');el.innerHTML=`<h2>0${i+1} · ${name}</h2><canvas width="180" height="140" aria-label="Animation ${i+1} agrandie"></canvas><p>${desc}</p><small>${detail} · Taille réelle ci-dessous</small><canvas class="real" width="180" height="140" aria-label="Animation ${i+1} taille réelle"></canvas>`;grid.append(el);views.push([...el.querySelectorAll('canvas')].map(c=>c.getContext('2d')))});
const note=document.createElement('div');note.className='note';note.innerHTML='<b>Base commune</b><p>Trois sphères argentées de 8–9 px sur cette capture, reflets blancs et contour sombre. Toutes restent derrière le personnage, sans ligne de liaison.</p><p><b>Conseil : 01</b> pour une présence discrète au repos ; <b>04</b> pour accentuer l’impression de compagnons qui suivent le personnage.</p><p>Maquette de mouvement sur une capture du jeu. Aucun changement du gameplay.</p>';grid.append(note);
function orb(c,x,y){x=Math.round(x);y=Math.round(y);c.fillStyle='#202832';c.beginPath();c.ellipse(x,y,4.5,4.5,0,0,Math.PI*2);c.fill();c.fillStyle='#6d7b88';c.beginPath();c.arc(x,y,3.5,0,Math.PI*2);c.fill();c.fillStyle='#b5c1ca';c.fillRect(x-2,y-3,4,4);c.fillStyle='#eff4f5';c.fillRect(x-1,y-2,2,1);c.fillStyle='#465461';c.fillRect(x+1,y+2,2,1)}
const base=[[57,49],[47,64],[43,80]],tau=Math.PI*2;
function points(i,t){return base.map(([x,y],j)=>{if(i===0)return[x+Math.sin(t*tau/4+j*.7)*.6,y+Math.sin(t*tau/4-j*.65)*2];if(i===1){const a=t*tau/2.8-j*.95;return[x+Math.cos(a)*1.5,y+Math.sin(a)*3]}if(i===2){const a=Math.sin(t*tau/3.6)*.157,dx=x-68,dy=y-36;return[68+dx*Math.cos(a)-dy*Math.sin(a),36+dx*Math.sin(a)+dy*Math.cos(a)]}if(i===3){const a=t*tau/4-j*.5,p=(1-Math.cos(a))/2,b=Math.sin(a*2)*.5;return[x-p*(3+j*1.5),y+p*(1+j*.6)+b]}const a=-Math.PI/2+t*tau/5+j*tau/3;return[49+Math.cos(a)*9,65+Math.sin(a)*19]})}
function frame(ms){if(last&&running)time+=Math.min((ms-last)/1000,.05)*speed;last=ms;if(img.complete&&img.naturalWidth)views.forEach((contexts,i)=>contexts.forEach(c=>{c.drawImage(img,0,0);points(i,time).forEach(p=>orb(c,...p))}));requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Reprendre'};document.getElementById('reset').onclick=()=>{time=0};document.getElementById('slow').onclick=e=>{speed=speed===1?.5:1;e.target.setAttribute('aria-pressed',speed===.5)};
</script></html>
