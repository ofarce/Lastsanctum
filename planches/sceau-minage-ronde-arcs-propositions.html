<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ronde en cascade · Arcs électriques</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1117;color:#e1d8bb;font:16px/1.5 system-ui}main{max-width:1550px;margin:auto;padding:28px}h1{font-size:27px;margin:0}p,small{color:#a8b7c0}button{padding:9px 16px;background:#202c37;color:#e1d8bb;border:1px solid #536575;cursor:pointer}button[aria-pressed=true]{border-color:#e1d8bb}.bar{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}article{background:#141d25;border:1px solid #394652;padding:16px}h2{font-size:21px;margin:0 0 12px}canvas{display:block;width:100%;image-rendering:pixelated}.real{width:180px;margin:8px auto}article p{min-height:66px;font-size:14px}.note{padding:22px;border:1px solid #394652;color:#a8b7c0}.note b{color:#e1d8bb}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style><main><h1>RONDE EN CASCADE · CINQ ARCS ÉLECTRIQUES</h1><p>Ronde en cascade retenue · Même orbite et mêmes sphères dans les cinq propositions. Seuls les petits arcs électriques changent : forme, cadence et intensité.</p><div class="bar"><button id="pause">Pause</button><button id="reset">Recommencer</button><button id="slow" aria-pressed="false">Ralenti ×0,5</button></div><div class="grid" id="grid"></div></main><script>
'use strict';
const variants=[
 ['Étincelles discrètes','Un petit arc blanc bleuté saute brièvement entre deux sphères voisines. Les intervalles de calme préservent la lisibilité.','Une décharge brève toutes les 1,4 s'],
 ['Relais électrique','Un arc passe successivement de la première paire à la deuxième puis à la troisième, dans le sens de la ronde.','Trois impulsions successives toutes les 2,4 s'],
 ['Filaments vivants','Deux filaments fins et peu lumineux frémissent en continu. Leur trajet se renouvelle sans masquer les sphères.','Deux liaisons fines · scintillement doux'],
 ['Triangle de décharge','Les trois côtés apparaissent ensemble pendant un instant, puis disparaissent. Une pulsation synchronisée ponctue la ronde.','Flash court toutes les 2,2 s'],
 ['Fourche vagabonde','Une décharge irrégulière rejoint deux sphères ; une minuscule branche libre accentue son caractère électrique.','Petits arcs ramifiés toutes les 1,7 s']
];
const grid=document.getElementById('grid'),img=new Image();img.src='assets/sceau-spheres/contexte.png';let running=true,time=0,last=0,speed=1;const views=[];
variants.forEach(([name,desc,detail],i)=>{const el=document.createElement('article');el.innerHTML=`<h2>0${i+1} · ${name}</h2><canvas width="180" height="140" aria-label="Animation ${i+1} agrandie"></canvas><p>${desc}</p><small>${detail} · Taille réelle ci-dessous</small><canvas class="real" width="180" height="140" aria-label="Animation ${i+1} taille réelle"></canvas>`;grid.append(el);views.push([...el.querySelectorAll('canvas')].map(c=>c.getContext('2d')))});
const note=document.createElement('div');note.className='note';note.innerHTML='<b>Ronde commune · 5 secondes</b><p>Trois sphères argentées derrière l’épaule. Petits arcs blanc bleuté, dessinés en pixels entre leurs surfaces.</p><p><b>Conseil : 02 · Relais électrique</b> accompagne le mouvement de la ronde tout en gardant des temps de calme.</p><p>Maquette de mouvement sur une capture du jeu. Aucun changement du gameplay.</p>';grid.append(note);
function orb(c,x,y){x=Math.round(x);y=Math.round(y);c.fillStyle='#202832';c.beginPath();c.ellipse(x,y,4.5,4.5,0,0,Math.PI*2);c.fill();c.fillStyle='#6d7b88';c.beginPath();c.arc(x,y,3.5,0,Math.PI*2);c.fill();c.fillStyle='#b5c1ca';c.fillRect(x-2,y-3,4,4);c.fillStyle='#eff4f5';c.fillRect(x-1,y-2,2,1);c.fillStyle='#465461';c.fillRect(x+1,y+2,2,1)}
const tau=Math.PI*2;
function points(i,t){return Array.from({length:3},(_,j)=>{const a=-Math.PI/2+t*tau/5+j*tau/3;return[49+Math.cos(a)*9,65+Math.sin(a)*19]})}
function links(i,t){const u=t%(i===0?1.4:i===1?2.4:i===3?2.2:1.7);if(i===0)return u<.16?[[Math.floor(t/1.4)%3,1]]:[];if(i===1){const j=Math.floor(u/.24);return j<3&&u%.24<.13?[[j,1]]:[]}if(i===2)return[[0,.5],[1,.5]];if(i===3)return u<.18?[[0,1],[1,1],[2,1]]:[];return u<.24?[[Math.floor(t/1.7)%3,1]]:[]}
function arcs(c,i,t,ps){for(const[j,alpha]of links(i,t)){const a=ps[j],b=ps[(j+1)%3],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;const start=[a[0]+dx/len*4.5,a[1]+dy/len*4.5],end=[b[0]-dx/len*4.5,b[1]-dy/len*4.5];const v=[[...start]];for(let k=1;k<5;k++){const q=k/5,w=Math.sin(j*17+k*23+Math.floor(t*14)*7)*(i===4?2.5:1.6);v.push([start[0]+(end[0]-start[0])*q+nx*w,start[1]+(end[1]-start[1])*q+ny*w])}v.push(end);c.globalAlpha=alpha;c.strokeStyle=i===2?'#9eb9c8':'#cce7f4';c.lineWidth=1;c.beginPath();v.forEach(([x,y],k)=>k?c.lineTo(Math.round(x)+.5,Math.round(y)+.5):c.moveTo(Math.round(x)+.5,Math.round(y)+.5));c.stroke();if(i===4){c.strokeStyle='#8aafc5';c.beginPath();c.moveTo(Math.round(v[2][0])+.5,Math.round(v[2][1])+.5);c.lineTo(Math.round(v[2][0]+nx*3-dx/len*2)+.5,Math.round(v[2][1]+ny*3-dy/len*2)+.5);c.stroke()}c.globalAlpha=1}}
function frame(ms){if(last&&running)time+=Math.min((ms-last)/1000,.05)*speed;last=ms;if(img.complete&&img.naturalWidth)views.forEach((contexts,i)=>contexts.forEach(c=>{c.drawImage(img,0,0);const ps=points(i,time);arcs(c,i,time,ps);ps.forEach(p=>orb(c,...p))}));requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Reprendre'};document.getElementById('reset').onclick=()=>{time=0};document.getElementById('slow').onclick=e=>{speed=speed===1?.5:1;e.target.setAttribute('aria-pressed',speed===.5)};
</script></html>
