<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sceau de minage · Trois sphères</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1117;color:#e1d8bb;font:16px/1.5 system-ui}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:28px;margin:0}p{color:#a8b7c0}button{padding:8px 18px;background:#202c37;color:#e1d8bb;border:1px solid #536575;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}article{background:#141d25;border:1px solid #394652;padding:16px}h2{font-size:21px;margin:0 0 12px}canvas{display:block;width:100%;image-rendering:pixelated}.real{width:180px;margin:12px auto}article p{min-height:48px;font-size:14px}small{color:#a8b7c0}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style><main><h1>SCEAU DE MINAGE · TROIS SPHÈRES ARGENTÉES</h1><p>Cinq pistes dans le décor du jeu. Trois petites sphères identiques, argent froid et reflets blancs. Gros plan puis taille réelle. Maquette uniquement.</p><button id="pause">Pause</button> <a style="color:#c9d6df" href="sceau-minage-spheres-propositions.png">Planche fixe</a><div class="grid" id="grid"></div></main><script>
const variants=[['Triangle compagnon','Formation triangulaire stable ; chaque sphère flotte lentement à son rythme.'],['Colonne flottante','Trois hauteurs distinctes ; ondulation décalée, silhouette très lisible.'],['Orbite latérale','Une petite ellipse verticale, à côté du buste ; profondeur suggérée par les ombres.'],['Essaim suiveur','Formation compacte qui se resserre et se détend doucement.'],['Sillage argenté','Un arc derrière l’épaule ; les trois sphères suivent avec un léger retard.']];
const img=new Image();img.src='assets/sceau-spheres/contexte.png';let running=true,time=0,last=0;const views=[];
variants.forEach(([name,desc],i)=>{const el=document.createElement('article');el.innerHTML=`<h2>0${i+1} · ${name}</h2><canvas width="180" height="140"></canvas><p>${desc}</p><small>Taille réelle</small><canvas class="real" width="180" height="140"></canvas>`;grid.append(el);views.push([...el.querySelectorAll('canvas')].map(c=>c.getContext('2d')))});
function orb(c,x,y){x=Math.round(x);y=Math.round(y);c.fillStyle='#202832';c.beginPath();c.ellipse(x,y,4.5,4.5,0,0,7);c.fill();c.fillStyle='#6d7b88';c.beginPath();c.arc(x,y,3.5,0,7);c.fill();c.fillStyle='#b5c1ca';c.fillRect(x-2,y-3,4,4);c.fillStyle='#eff4f5';c.fillRect(x-1,y-2,2,1);c.fillStyle='#465461';c.fillRect(x+1,y+2,2,1)}
function points(i,t){return Array.from({length:3},(_,j)=>{const a=t*.8+j*Math.PI*2/3,b=Math.sin(t*1.5+j*1.7)*1.5;if(i===0)return [[110,57],[123,68],[110,80]][j].map((v,k)=>v+(k?b:0));if(i===1)return [115+Math.sin(t+j)*1.5,49+j*16+b];if(i===2)return [116+Math.cos(a)*10,65+Math.sin(a)*15];if(i===3)return [117+Math.cos(a)*7,65+Math.sin(a)*9];return [57-j*7+Math.sin(t*1.2-j*.45)*2,49+j*15+b]})}
function frame(ms){if(last&&running)time+=Math.min((ms-last)/1000,.05);last=ms;if(img.complete&&img.naturalWidth)views.forEach((contexts,i)=>contexts.forEach(c=>{c.drawImage(img,0,0);points(i,time).forEach(p=>orb(c,...p))}));requestAnimationFrame(frame)}requestAnimationFrame(frame);document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Reprendre'};
</script></html>
