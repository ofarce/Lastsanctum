 ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1);y++)for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++){const dx=(x-cx)/(rx+.4),dy=(y-cy)/(ry+.4);if(dx*dx+dy*dy<=1)this.p(x,y,c)}}
