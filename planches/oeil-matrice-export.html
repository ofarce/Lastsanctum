<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Export Œil</title><style>html,body{margin:0;background:#ff00ff;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
'use strict';
// Export de l'Œil de la Matrice vers assets/imported/oeil/ (tools/oeil/export.sh). Code de dessin : planches/matrice-bullet-hell.html.
/* ======================= tampon pixel (même outillage que boss-bete-propositions) ======================= */
const W=200,H=150,CX=100,FY=140,OUT='#0b090b',TAU=Math.PI*2;
const B4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+.5)/16));
const bay=(x,y)=>B4[y&3][x&3];
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const ease=x=>{x=cl(x);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAL={
 pale:['#2c2024','#4c3a3c','#76605e','#a08a82','#c8b4a8','#ecdcd0'],
 flesh:['#2a0a0c','#4e1416','#7a2422','#a03a32','#c4604e','#e08c74'],
 blood:['#200406','#4a0a0e','#7e1216','#b41c20','#e2382e','#ff8a6a'],
 bone:['#1e1a16','#3a3228','#625644','#8e8068','#b8ac90','#e0d8c4'],
 night:['#0a0a0e','#141218','#201c24','#2e2830','#40383e','#544a50'],
 ichor:['#060606','#121014','#1e1a1e','#2c2628'],
 slate:['#1b2028','#232933','#2b323d','#333a46','#404955'],
 memb:['#3a1416','#6a2a2a','#9a4a44','#c47a6a','#e0a894','#f2cdb8'],
 sclera:['#6a5a52','#a8988e','#d6c8bc','#efe4da','#fff6ee'],
};
const HEX={};const rgb=h=>HEX[h]||(HEX[h]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));
class Px{constructor(){this.c=new Array(W*H).fill(null);this.fx=new Array(W*H).fill(null)}
 has(x,y){x=Math.round(x);y=Math.round(y);return x>=0&&y>=0&&x<W&&y<H&&!!this.c[y*W+x]}
 get(x,y){x=Math.round(x);y=Math.round(y);return x>=0&&y>=0&&x<W&&y<H?this.c[y*W+x]:null}
 set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H||!c)return;this.c[y*W+x]=c}
 paint(x,y,c){if(this.has(x,y))this.set(x,y,c)}
 fxs(x,y,c,a=1){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H||!c)return;if(a<1&&a<=bay(x,y))return;this.fx[y*W+x]=c}}
const sh=(r,v,x,y)=>{v=cl(v);const f=v*(r.length-1),i=Math.floor(f);return r[Math.min(r.length-1,f-i>bay(x,y)?i+1:i)]};
function ell(P,cx,cy,rx,ry,r,o={}){const v0=o.v??.6,l=o.l??.32,edge=o.edge??.22;
 for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
  const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry,d=dx*dx+dy*dy;if(d>1)continue;
  let v=v0+l*(-dx*.55-dy*.6)-(o.rim??.1)*d;
  const dx2=(x+1.5-cx)/rx,dy2=(y+1.5-cy)/ry;if(edge&&(dx2*dx2+dy*dy>1||dx*dx+dy2*dy2>1))v-=edge;
  (o.on?P.paint:P.set).call(P,x,y,sh(r,v,x,y))}}
function inPoly(pts,x,y){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[a,b]=pts[i],[e,f]=pts[j];if((b>y)!==(f>y)&&x<(e-a)*(y-b)/(f-b)+a)c=!c}return c}
function poly(P,pts,r,o={}){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
 const cx=(x0+x1)/2,cy=(y0+y1)/2,hw=Math.max(1,(x1-x0)/2),hh=Math.max(1,(y1-y0)/2),v0=o.v??.55,l=o.l??.3,edge=o.edge??.2;
 for(let y=Math.floor(y0);y<=y1;y++)for(let x=Math.floor(x0);x<=x1;x++){if(!inPoly(pts,x+.5,y+.5))continue;
  const nx=(x+.5-cx)/hw,ny=(y+.5-cy)/hh;let v=v0+l*(-nx*.5-ny*.35);
  if(edge&&(!inPoly(pts,x+1.5,y+.5)||!inPoly(pts,x-.5,y+.5)||!inPoly(pts,x+.5,y+1.5)))v-=edge;
  P.set(x,y,sh(r,v,x,y))}}
function bez(p,t){const u=1-t;return[0,1].map(k=>u*u*u*p[0][k]+3*u*u*t*p[1][k]+3*u*t*t*p[2][k]+t*t*t*p[3][k])}
function tube(P,pts,r0,r1,ramp,o={}){const n=o.n??44;for(let i=0;i<=n;i++){const t=i/n,[x,y]=bez(pts,t),r=r0+(r1-r0)*t;
 ell(P,x,y,Math.max(.7,r),Math.max(.7,r),ramp,{v:(o.v??.5)+t*(o.dv??.1)+(o.ring?((i%o.ring)<1?-.16:0):0),l:.42,edge:0,rim:.28})}}
function line(P,x0,y0,x1,y1,c,mode,a){const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));
 for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;mode==='fx'?P.fxs(x,y,c,a):mode==='on'?P.paint(x,y,c):P.set(x,y,c)}}
function glow(P,cx,cy,r,c,a=1){if(a<=.02)return;for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){const d=Math.hypot(x+.5-cx,y+.5-cy)/r;if(d<1)P.fxs(x,y,c,a*(1-d)*(1-d))}}
function veins(P,R,x,y,n,len,dir,pulse,col=PAL.blood){for(let k=0;k<n;k++){let px=x+(R()-.5)*6,py=y,a=dir+(R()-.5)*1.4;const L=len*(.6+R()*.6);
 for(let i=0;i<L;i++){a+=(R()-.5)*.6;px+=Math.cos(a);py+=Math.sin(a);if(!P.has(px,py))break;P.paint(px,py,col[2]);
  const lit=pulse*(1-i/L);if(lit>.05)P.fxs(px,py,lit>.55?col[5]:col[4],lit);if(R()<.06){const b=a+(R()<.5?1:-1)*.9;let qx=px,qy=py;for(let j=0;j<L*.3;j++){qx+=Math.cos(b);qy+=Math.sin(b);P.paint(qx,qy,col[1])}}}}}
function maw(P,cx,cy,w,h,open,o={}){const oh=Math.max(.6,h*open),lip=o.lip??PAL.flesh;
 ell(P,cx,cy,w/2+2.2,oh/2+2.4,lip,{v:.48,l:.3,edge:.25,on:o.on});
 if(open<.08){line(P,cx-w/2,cy,cx+w/2,cy,PAL.ichor[0]);for(let x=Math.ceil(cx-w/2+1);x<cx+w/2-1;x+=(o.step??3))P.set(x,cy+1,PAL.bone[4]);return}
 for(let y=Math.floor(cy-oh/2);y<=cy+oh/2;y++)for(let x=Math.floor(cx-w/2);x<=cx+w/2;x++){const dx=(x+.5-cx)/(w/2),dy=(y+.5-cy)/(oh/2);if(dx*dx+dy*dy>1)continue;
  P.set(x,y,dy>.35?PAL.flesh[1]:PAL.ichor[1]);const d=dx*dx+dy*dy;if(d<.35)P.fxs(x,y,d<.12?PAL.blood[4]:PAL.blood[3],(1-d/.35)*open)}
 const step=o.step??3;for(let x=Math.ceil(cx-w/2+1);x<cx+w/2-1;x+=step){const dx=(x-cx)/(w/2),e=Math.sqrt(Math.max(0,1-dx*dx))*oh/2,tl=Math.min(o.teeth??3,e+.6);
  for(let j=0;j<tl;j++){P.set(x,cy-e+j,j<1?PAL.bone[5]:PAL.bone[4]);P.set(x,cy+e-j,j<1?PAL.bone[4]:PAL.bone[3])}}
 if(open>.5&&o.drool!==false){const k=(open-.5)*2;for(let i=0;i<2;i++){const x=cx-w/4+i*w/2;for(let j=0;j<oh*.7*k;j++)P.fxs(x+Math.sin(j*.5)*.4,cy-oh/2+2+j,PAL.memb[4],.7)}}}
function eye(P,x,y,r,lit=1,blink=0){if(blink>.5){line(P,x-r,y,x+r,y,PAL.ichor[0]);return}
 ell(P,x,y,r+.8,r*.8+.6,PAL.ichor,{v:.1,l:0,edge:0});ell(P,x,y,r,r*.75,PAL.blood,{v:.75,l:.25,edge:.1});P.set(x-.3,y-.3,PAL.blood[5]);glow(P,x,y,r*3,PAL.blood[4],.55*lit)}
function spike(P,base,tip,w,r){const[bx,by]=base,[tx,ty]=tip,L=Math.hypot(tx-bx,ty-by)||1,nx=-(ty-by)/L,ny=(tx-bx)/L;poly(P,[[bx+nx*w/2,by+ny*w/2],[tx,ty],[bx-nx*w/2,by-ny*w/2]],r,{v:.6,l:.35})}
function drip(P,x,y0,len,t,sp=1,col=PAL.ichor){const k=((t*sp)%1),y=y0+k*len;line(P,x,y0,x,y0+Math.min(len,k*len*.6),col[2],'fx',1);P.fxs(x,y,col[3],1-k);P.fxs(x,y+1,col[1],1-k)}
// reflets humides : points clairs sur le quart haut-gauche
function wet(P,R,cx,cy,rx,ry,n){for(let i=0;i<n;i++){const an=Math.PI*(1.05+R()*.6),r=.3+R()*.55,x=cx+Math.cos(an)*rx*r,y=cy+Math.sin(an)*ry*r;if(P.has(x,y)){P.set(x,y,PAL.pale[5]);if(R()<.5)P.paint(x+1,y,PAL.pale[4])}}}

/* ======================= corps commun de la Matrice ======================= */
function mound(P,t,st,o={}){const R=rng(o.seed||11),br=Math.sin(t*OM.br)*1.4,a=st.a||0,skin=o.skin||PAL.pale;
 // flaque de mousse veinée sous la masse
 for(let y=FY-6;y<=FY+6;y++)for(let x=CX-97;x<=CX+97;x++){const dx=(x-CX)/(94+Math.sin(y*1.3+x*.08)*4),dy=(y-FY)/5.5;if(dx*dx+dy*dy>1)continue;
  const n=Math.sin(x*.9+y*1.7)*Math.cos(x*.31-y*.6);P.set(x,y,n>.62?PAL.pale[1]:n>.34?PAL.night[3]:sh(PAL.ichor,.5-dy*.3,x,y));
  if(Math.abs(Math.sin(x*.21+y*.9)+Math.cos(x*.13))<.05)P.set(x,y,PAL.blood[2])}
 // racines-tentacules
 if(o.tent!==false)for(let i=0;i<6;i++){const s=i%2?1:-1,bx=CX+s*(40+(i>>1)*14),sw=Math.sin(t*OM.tent+i*1.7)*5+a*Math.sin(t*OM.fast+i)*2,ex=bx+s*(22+(i>>1)*6);
  tube(P,[[bx,FY-14],[bx+s*10,FY-28+sw*.4],[ex-s*6,FY-3+sw*.5],[ex+s*6+sw,FY-8-sw*.5]],5.2-(i>>1)*.6,1,skin,{v:.42,dv:.15,ring:4})}
 if(o.spikes!==false)for(let i=0;i<7;i++){const x=CX-40+i*13+(R()-.5)*4,y=FY-80-Math.sqrt(Math.max(0,1-((x-CX)/70)**2))*16-br;spike(P,[x,y+8],[x+(x-CX)*.18+(R()-.5)*6,y-10-R()*10],6,PAL.bone)}
 ell(P,CX,FY-46-br*.5,72,48+br,skin,{v:.56,l:.38,rim:.18});
 ell(P,CX-46,FY-16,32,18,skin,{v:.5,l:.34});ell(P,CX+50,FY-14,30,17,skin,{v:.46,l:.34});
 for(let k=0;k<6;k++){const y0=FY-82+k*12+br*.3;for(let x=CX-70;x<=CX+70;x++){const y=y0+Math.sin(x*.07+k*1.3)*3+((x-CX)/70)**2*10;P.paint(x,y,skin[1]);P.paint(x,y+1,skin[4])}}
 // plis de la base
 for(let x=CX-74;x<=CX+78;x+=7){const y=FY-8+Math.sin(x)*1.5;line(P,x,y,x+2,y-6,skin[1],'on')}
 veins(P,R,CX,FY-6,o.nv??5,58,-Math.PI/2,(o.vein??((Math.sin(t*OM.vein)*.5+.5)*.4))+a*.3);
 veins(P,R,CX-40,FY-28,3,32,-Math.PI*.75,(Math.sin(t*OM.vein-1)*.5+.5)*.3);veins(P,R,CX+44,FY-28,3,32,-Math.PI*.25,(Math.sin(t*OM.vein-2)*.5+.5)*.3);
 wet(P,R,CX,FY-46,72,48,o.wet??46);wet(P,R,CX-46,FY-16,32,18,8);
 return br}
function cluster(P,t,pts,br,lit=.7){const bl=(Math.sin(t*OM.blink)>.95)?1:0;pts.forEach(([x,y,r],i)=>eye(P,x,y-br,r,lit,i%2?bl:0))}

/* ======================= export de l'Œil de la Matrice (calques du jeu) =======================
   Piste « 1 · L'Orbite » de planches/oeil-maj.html (choisie le 2026-11-19), en trois phases.
   Par phase : corps (repos 48 images à 12 i/s = 4 s ; tir 24 images = 2 s), iris (4 dilatations + orbite vide),
   paupières (12 ouvertures). L'œil reste fixe dans le cadre (pas de respiration) pour que les calques se
   superposent au pixel près. Fond magenta (#ff00ff), découpé et rendu transparent par tools/oeil/cut.py. */
let OM={br:TAU/4,tent:TAU/4,fast:TAU,vein:TAU/2,blink:TAU/4,drip:.5};
const EX=CX,EY=FY-60,ERX=27,ERY=19,IR=9;
const BLOOD_PH=[.12,.45,.9];
function lashT(P,bx,by,tx,ty,w){const n=Math.ceil(Math.hypot(tx-bx,ty-by));for(let i=0;i<=n;i++){const u=i/n,x=lerp(bx,tx,u),y=lerp(by,ty,u);
 P.set(x,y,u>.6?PAL.bone[5]:u>.25?PAL.bone[4]:PAL.bone[2]);if(w>1&&u<.55)P.set(x+1,y,PAL.bone[1])}}
function body(P,t,a,ph){const st={a};const br=mound(P,t,st,{seed:53,nv:4}),R=rng(61);
 // petits yeux du corps
 {const Q=rng(53);for(let i=0;i<16;i++){const x=CX+(Q()-.5)*132,y=FY-42+(Q()-.5)*76,pp=Q()*20,r=1.1+Q()*1.4;
  if(!P.has(x,y)||Math.hypot((x-EX)/44,(y-EY)/34)<1)continue;eye(P,x,y-br*.5,r,.35+a*.65,Math.sin(t*OM.blink+pp)>.93?1:0)}}
 // pattes d'oie
 for(const s of[-1,1])for(let k=0;k<4;k++){const an=(s<0?Math.PI:0)+s*(k-1.5)*.28;let x=EX+s*(ERX+9),y=EY+1;for(let j=0;j<12+k*2;j++){x+=Math.cos(an);y+=Math.sin(an)*.8+Math.sin(j*.6)*.2;P.paint(x,y,PAL.pale[1]);P.paint(x,y-1,PAL.pale[4])}}
 ell(P,EX,EY+1,ERX+12,ERY+11,PAL.pale,{v:.5,l:.42,edge:.18});
 ell(P,EX,EY-ERY*.5,ERX+6,ERY*.8,PAL.pale,{v:.62,l:.45,edge:.12});
 ell(P,EX,EY+.5,ERX+2.6,ERY+2.4,PAL.flesh,{v:.12,l:.2,edge:0});
 // blanc de l'œil, veines et sang selon la phase
 const blood=BLOOD_PH[ph];
 for(let y=Math.floor(EY-ERY);y<=EY+ERY;y++)for(let x=Math.floor(EX-ERX);x<=EX+ERX;x++){const dx=(x+.5-EX)/ERX,dy=(y+.5-EY)/ERY,d=dx*dx+dy*dy;if(d>1)continue;
  let c=sh(PAL.sclera,.78-dy*.25-d*.45,x,y);if(d>.45&&bay(x,y)<(blood-.45)*1.05*(d-.3))c=PAL.memb[2];P.set(x,y,c)}
 const inE=(x,y)=>((x+.5-EX)/ERX)**2+((y+.5-EY)/ERY)**2<=1;
 const V=rng(5);const nv=6+Math.round(blood*12);
 for(let k=0;k<nv;k++){let an=V()*TAU,r=.98;const Ln=5+V()*6+blood*9;
  for(let j=0;j<Ln;j++){an+=(V()-.5)*.22;const x=EX+Math.cos(an)*ERX*r,y=EY+Math.sin(an)*ERY*r;if(inE(x,y))P.set(x,y,j<Ln*.45?PAL.blood[3]:PAL.blood[2]);r-=.035+V()*.02;
   if(V()<.1){let b=an+(V()<.5?.5:-.5),q=r;for(let i=0;i<4;i++){const X=EX+Math.cos(b)*ERX*q,Y=EY+Math.sin(b)*ERY*q;if(inE(X,Y))P.set(X,Y,PAL.blood[2]);q-=.04}}}}
 for(let s=0;s<9;s++){const an=Math.PI*1.1+s*.075;P.set(EX+Math.cos(an)*ERX*.8,EY+Math.sin(an)*ERY*.72,PAL.sclera[4])}
 // larmes : d'ichor, laiteuses, puis de sang
 const col=ph>=2?PAL.blood:ph===1?PAL.memb:PAL.ichor,n=2+ph;
 for(let i=0;i<n;i++)drip(P,EX-(n-1)*3.5+i*7,EY+ERY+4,12+ph*4,t+i*.31,OM.drip,col);
 wet(P,R,EX,EY-ERY*.6-ERY*.4,ERX,ERY*.5,10);
 maw(P,CX,FY-18,30,12,.1+a*.4,{step:2.6,teeth:3});
}
// iris centré en (cx, cy) ; a : dilatation ; out : orbite vide (les pupilles sont sorties)
function iris(P,a,ph,cx,cy,out){const R=rng(91),pw=lerp(.14,.44,a);
 for(let y=cy-15;y<=cy+15;y++)for(let x=cx-15;x<=cx+15;x++){const ix=(x+.5-cx)/IR,iy=(y+.5-cy)/IR,id=Math.hypot(ix,iy);let c=null;
  if(out){if(id<1.1)c=id<.72?PAL.ichor[0]:id<.94?PAL.flesh[1]:PAL.flesh[3]}
  else if(id<.86&&Math.abs(ix)<pw)c=PAL.ichor[0];
  else if(id<1){const an=Math.atan2(iy,ix);let v=.48+(1-id)*.3-iy*.22+Math.sin(an*13+Math.sin(an*4)*1.6)*.14*(id>.42?1:.4);if(id>.5&&id<.6)v+=.2;if(id>.9)v-=.2;c=sh(PAL.blood,v,x,y)}
  else if(id<1.13)c=PAL.blood[1];
  if(c)P.set(x,y,c)}
 if(out){for(let i=0;i<3;i++)P.set(cx-3+i*3,cy+IR*.9,PAL.blood[4]);return}
 if(ph>=1){const nc=ph===1?3:5;for(let k=0;k<nc;k++){let an=k*2.1+.6+Math.sin(k*7)*.3,x=cx,y=cy;const Ln=IR*(ph===1?1.05:1.6);
  for(let j=0;j<Ln;j++){an+=(R()-.5)*.45;x+=Math.cos(an);y+=Math.sin(an)*.8;const ins=Math.hypot((x+.5-cx)/IR,(y+.5-cy)/IR);if(ins>1.65)break;if(ins>.6)P.set(x,y,ins<1?PAL.blood[5]:PAL.blood[1])}}}
 const hx=cx-IR*.38,hy=cy-IR*.4;P.set(hx,hy,'#fffbe8');P.set(hx+1,hy,PAL.sclera[4]);P.set(hx,hy+1,PAL.sclera[3]);P.set(hx+IR*.9,hy+IR*.95,PAL.sclera[3])}
// paupières à l'ouverture open, centrées en (cx, cy) : peau plissée, cils-dents, caroncules ; fendue en III
function lids(P,open,ph,cx,cy){const R=rng(5),L=dx=>open*Math.sqrt(Math.max(0,1-dx*dx));
 for(let y=Math.floor(cy-ERY);y<=cy+ERY;y++)for(let x=Math.floor(cx-ERX);x<=cx+ERX;x++){const dx=(x+.5-cx)/ERX,dy=(y+.5-cy)/ERY;if(dx*dx+dy*dy>1)continue;const l=L(dx);
  if(Math.abs(dy)>l){const e=Math.abs(dy)-l;let v=.62-dy*.3-(e<.09?.34:e<.18?.1:0);if(e>.2&&Math.abs(((e*ERY)%3.4)-1.7)<.45)v-=.16;P.set(x,y,sh(PAL.pale,v,x,y))}}
 for(let x=-ERX+3;x<=ERX-3;x+=3.3){const f=Math.sqrt(1-(x/ERX)**2),lid=open*f*ERY,Ln=4.8*(.55+.45*f)*(.85+R()*.3),s=x>0?1:-1;
  lashT(P,cx+x,cy-lid-.5,cx+x*1.08+s*Ln*.3,cy-lid-1-Ln,2);lashT(P,cx+x,cy+lid+.5,cx+x*1.08+s*Ln*.15,cy+lid+1+Ln*.75,2)}
 for(const s of[-1,1])ell(P,cx+s*(ERX-2.5),cy+.5,2.2,1.7*Math.max(.4,open),PAL.memb,{v:.55,l:.3,edge:0});
 if(ph>=2){const y0=cy-L(-.33)*ERY-1;for(let j=0;j<11;j++){const y=y0-j,w=Math.max(0,3.2-j*.25);if(y<cy-ERY)break;for(let x=-w;x<=w;x++)P.set(cx-9+x+j*.35,y,Math.abs(x)>w-1?PAL.blood[3]:PAL.flesh[1])}}}
// rendu d'un tampon (contour compris) dans g à (ox, oy), fond magenta laissé tel quel ; w, h : taille utile
