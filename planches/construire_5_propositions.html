<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#14130f;--ink:#e8e0c8;--mut:#9b927a;--gold:#e8c35a;--line:#5d5640;--panel:#0d0d0b;--red:#d36a52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f}}
:root[data-theme="dark"]{--bg:#14130f}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif",serif;padding:24px 16px}
h1{font-weight:400;font-size:26px;margin:0 0 4px}.lead{color:var(--mut);margin:0 0 28px;max-width:900px}
.prop{max-width:1240px;margin:0 auto 40px}.prop h2{font-weight:400;font-size:19px;margin:0 0 4px}.prop h2 b{color:var(--gold);font-weight:400;margin-right:8px}
.prop p{color:var(--mut);margin:0 0 10px;font-size:14px}
.stage{position:relative;height:300px;border:1px solid var(--line);background-size:cover;background-position:bottom;overflow-x:auto;overflow-y:hidden}
.hud{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(#0d0d0bf2,#0a0a08);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;font-style:italic}
.row{position:absolute;bottom:132px;left:0;right:0;width:max-content;margin:auto;padding:0 12px;display:flex;gap:8px;align-items:flex-end}
.sq{position:relative;width:var(--s,84px);height:var(--s,84px);background:#1a1913e6;border:1px solid var(--line);box-sizing:border-box;cursor:pointer;flex:none;transition:transform .12s,width .12s,height .12s}
.sq img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;image-rendering:pixelated}
.sq .k{position:absolute;right:3px;bottom:2px;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:0 3px;background:#0d0d0b}
.sq.lock img{filter:grayscale(1) brightness(.45)}.sq.lock::after{content:"🔒";position:absolute;left:4px;top:2px;font-size:11px}
.sq.on{border:2px solid var(--gold);box-shadow:0 0 0 1px #000,0 0 12px #e8c35a66}
.cost{color:var(--gold)}.cost.no{color:var(--red)}
.lbl{white-space:nowrap;background:#0d0d0bf2;border:1px solid var(--line);padding:5px 12px;font-size:15px}
.lbl .sep{color:var(--mut);margin:0 6px}
.why{font-size:12px;color:var(--mut);font-style:italic;margin-left:8px}
</style></head><body>
<h1>Menu « Construire » — 5 propositions</h1>

P.forEach((p,i)=>{
