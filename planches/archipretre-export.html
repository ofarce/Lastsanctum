<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archiprêtre, export</title>
<style>
/* Export des sprites de l'Archiprêtre aux racines (silhouette A « Agenouillé, soudé à l'autel », choisie le
   2026-11-22 sur planches/archipretre-racines-rendu.html). Une bande par animation, cadre 56 × 56 au pixel natif,
   pied au milieu du bas (ax 28, ay 53). window.ATLAS : nom → image PNG en data URL (lue par l'export du jeu,
   assets/imported/archipretre/). */
:root{color-scheme:dark;--bg:#12131a;--fg:#e4e2da;--mute:#9a9cae}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:24px 16px}
h1{font:400 32px "Courier New",monospace;margin:0 0 16px}
.strip{margin:0 0 18px}
.strip canvas{image-rendering:pixelated;background:#1c222d;border:2px solid #0b0a0f;max-width:100%}
.strip p{margin:4px 0;color:var(--mute)}
</style>
</head>
<body>
<h1>Archiprêtre aux racines · export</h1>
<div id="out"></div>
<script>
'use strict';
const R = {
  linen: ['#2a2420', '#6e5e4c', '#a89478', '#d8c8a8', '#f2ead4'],
  stole: ['#2a0e14', '#6a1e2a', '#a8323a', '#d85a4a', '#f6906a'],
  skin:  ['#2e2a30', '#5e5660', '#8c8490', '#b8b0b8', '#dcd6da'],
  root:  ['#160e12', '#3a2228', '#5c3a3a', '#7e5648', '#a07a5e'],
  moss:  ['#141e10', '#2c4a22', '#4e7a34', '#7eaa48', '#b8d878'],
  bulb:  ['#2a060c', '#6a1420', '#a8202e', '#d84a4a', '#ff9a7a'],
  core:  ['#5a2a10', '#c06a20', '#f0b040', '#ffe08a', '#ffffff'],
  dead:  ['#141014', '#2e2628', '#4a3e3e', '#665a56', '#80766e'],
};
const MAT = Object.keys(R);
function buf(w, h) { return { w, h, m: new Int8Array(w * h).fill(-1), s: new Float32Array(w * h) }; }
function put(b, x, y, mat, s) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= b.w || y >= b.h) return; b.m[y * b.w + x] = MAT.indexOf(mat); b.s[y * b.w + x] = s; }
function blob(b, cx, cy, rx, ry, mat, bias = 0) {
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry, d = dx * dx + dy * dy; if (d > 1) continue;
    const nz = Math.sqrt(1 - Math.min(d, 1)); put(b, x, y, mat, (-dx * .55 - dy * .65 + nz * .75) * .62 + .28 + bias);
  }
}
function rect(b, x0, y0, w, h, mat, bias = 0) { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { const u = (x - x0 + .5) / w, v = (y - y0 + .5) / h; put(b, x, y, mat, .75 - u * .45 - v * .2 + bias); } }
function trap(b, cx, y0, h, w0, w1, mat, bias = 0) {
  for (let y = y0; y < y0 + h; y++) { const v = (y - y0) / h, w = w0 + (w1 - w0) * v;
    for (let x = Math.floor(cx - w / 2); x <= Math.ceil(cx + w / 2); x++) { const u = (x - (cx - w / 2)) / w; put(b, x, y, mat, .8 - u * .5 - v * .15 + bias); } }
}
function root(b, pts, w0, w1, mat = 'root') {
  const n = pts.length - 1;
  for (let k = 0; k < n; k++) {
    const [x0, y0] = pts[k], [x1, y1] = pts[k + 1], L = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.ceil(L * 2));
    for (let s = 0; s <= steps; s++) { const t = s / steps, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t, w = w0 + (w1 - w0) * ((k + t) / n);
      blob(b, x, y, Math.max(.6, w / 2), Math.max(.6, w / 2), mat, -.05); }
  }
}
function px(b, x, y, mat, s) { put(b, x, y, mat, s); }
function moss(b, onMat, rate, seed) {
  let s = seed; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; const m = MAT.indexOf(onMat);
  for (let i = 0; i < b.w * b.h; i++) if (b.m[i] === m && rnd() < rate) { b.m[i] = MAT.indexOf('moss'); b.s[i] = .3 + rnd() * .5; }
}
// Dessin de la silhouette A, paramétré par image :
//   pulse 0..1 (bulbe qui gonfle), open (bulbe ouvert), raise 0..1 (racines levées : appel), dead 0..1 (chute).
function kneeling(o) {
  const b = buf(56, 56);
  const pulse = o.pulse || 0, raise = o.raise || 0, dead = o.dead || 0;
  const body = dead > 0.5 ? 'dead' : 'linen', bulbM = dead > 0.3 ? 'dead' : 'bulb';
  const sink = Math.round(dead * 4);
  const lift = raise * 7;
  root(b, [[28, 26 + sink], [16 - raise * 2, 30 - lift], [9 - raise * 3, 42 - lift * 1.4], [4, 53]], 4, 1.4);
  root(b, [[28, 26 + sink], [41 + raise * 2, 31 - lift], [47 + raise * 3, 43 - lift * 1.4], [52, 53]], 4, 1.4);
  root(b, [[26, 30 + sink], [19, 42 - lift * .6], [16, 53]], 3, 1.2);
  root(b, [[30, 30 + sink], [37, 42 - lift * .6], [40, 53]], 3, 1.2);
  if (dead < 0.95) root(b, [[28, 27 + sink], [27, 18 + sink * 1.5], [28, 12 + sink * 3]], 4, 3);
  const by = 9 + sink * 3, br = (1 + pulse * 0.1) * (1 - dead * 0.6);
  if (o.open && dead === 0) {
    for (const [dx, dy] of [[-8, -3], [8, -3], [-6, 4], [6, 4]]) blob(b, 28 + dx * (1 + pulse * .08), by + dy, 3.6, 2.6, 'bulb', -.1);
    blob(b, 28, by, 7 * br, 6 * br, 'bulb', .05);
    blob(b, 28, by - 1, 4 * br, 3.4 * br, 'core', .2 + pulse * .1);
  } else if (br > 0.2) {
    blob(b, 28, by, 6.5 * br, 6 * br, bulbM, dead > 0 ? -.2 : 0);
    if (dead === 0) for (let k = 0; k < 4; k++) px(b, 25 + k * 2, by - 3 + (k & 1), 'bulb', .95);
  }
  trap(b, 28, 40 + sink, 12 - sink, 18, 28 + sink * 2, body, -.05);
  trap(b, 28, 28 + sink * 2, 13 - sink, 16, 18, body);
  rect(b, 26, 29 + sink * 2, 4, 22 - sink * 2, dead > 0.5 ? 'dead' : 'stole');
  blob(b, 28, 25 + sink * 2.5, 5.4, 5, body, -.12);
  blob(b, 28, 27 + sink * 2.5, 3.2, 2.8, dead > 0.5 ? 'dead' : 'skin', -.1);
  if (dead < 0.3) { px(b, 27, 27, 'bulb', .9); px(b, 29, 27, 'bulb', .9); }
  // mains : jointes au repos, ouvertes vers le sol pendant l'appel
  const hx = raise * 4;
  blob(b, 26.5 - hx, 35 + sink * 2 + raise * 3, 2.2, 2.4, dead > 0.5 ? 'dead' : 'skin');
  blob(b, 29.5 + hx, 35 + sink * 2 + raise * 3, 2.2, 2.4, dead > 0.5 ? 'dead' : 'skin', .05);
  root(b, [[22, 46], [15 - raise * 3, 51]], 2, 1); root(b, [[34, 46], [42 + raise * 3, 51]], 2, 1);
  moss(b, body === 'linen' ? 'linen' : 'dead', .05 + dead * .1, 11); moss(b, 'root', .1, 5);
  return b;
}
function paint(g, b, ox) {
  const col = (i) => { const r = R[MAT[b.m[i]]]; const v = Math.max(0, Math.min(.999, b.s[i])) * (r.length - 1.0001); return r[Math.min(Math.max(Math.round(v), 1), r.length - 1)]; };
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) { const i = y * b.w + x; if (b.m[i] < 0) continue; g.fillStyle = col(i); g.fillRect(ox + x, y, 1, 1); }
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
    if (b.m[y * b.w + x] >= 0) continue; let best = -1;
    for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) { const X = x + dx, Y = y + dy; if (X < 0 || Y < 0 || X >= b.w || Y >= b.h) continue; const j = Y * b.w + X; if (b.m[j] >= 0) { best = b.m[j]; break; } }
    if (best >= 0) { g.fillStyle = R[MAT[best]][0]; g.fillRect(ox + x, y, 1, 1); }
  }
}
const W = 56, H = 56;
const ANIMS = {
  idle: { count: 6, fps: 6, loop: true, f: (k) => ({ pulse: (1 - Math.cos(k / 6 * Math.PI * 2)) / 2 }) },
  open: { count: 4, fps: 8, loop: true, f: (k) => ({ open: true, pulse: (1 - Math.cos(k / 4 * Math.PI * 2)) / 2 }) },
  cast: { count: 6, fps: 10, loop: false, f: (k) => ({ raise: Math.sin(k / 5 * Math.PI), pulse: k / 5 }) },
  death: { count: 8, fps: 8, loop: false, f: (k) => ({ dead: k / 7 }) },
};
window.ATLAS = {};
const meta = { frame_w: W, frame_h: H, ax: 28, ay: 53, anims: {} };
for (const [name, a] of Object.entries(ANIMS)) {
  const c = document.createElement('canvas'); c.width = W * a.count; c.height = H;
  const g = c.getContext('2d');
  for (let k = 0; k < a.count; k++) paint(g, kneeling(a.f(k)), k * W);
  window.ATLAS[name] = c.toDataURL('image/png');
  meta.anims[name] = { count: a.count, fps: a.fps, loop: a.loop };
  const d = document.createElement('div'); d.className = 'strip';
  const show = document.createElement('canvas'); show.width = c.width * 3; show.height = c.height * 3;
  const sg = show.getContext('2d'); sg.imageSmoothingEnabled = false; sg.drawImage(c, 0, 0, show.width, show.height);
  d.appendChild(show); const p = document.createElement('p'); p.textContent = `${name} · ${a.count} images · ${a.fps} i/s`; d.appendChild(p);
  document.getElementById('out').appendChild(d);
}
window.META = meta;
</script>
</body>
</html>
