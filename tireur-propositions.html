<header><h1>LE TIREUR · 3 PROPOSITIONS DE MODÈLE</h1><p>Base : planche « casque saurus ». Modèles 3D procéduraux (faces réelles, éclairage, tri de profondeur), même projection isométrique que <code>Index.html</code>. Glissez sur un modèle pour le tourner.</p></header>

<script>
'use strict';
const P={rust:'#7a5236',steel:'#a4aab3',gun:'#4a4c53',black:'#1f2024',ivory:'#ddd3bd',crim:'#7d1f2c',brass:'#b88d4a',leath:'#5e3f2b',skin:'#d9b39c',amber:'#ffb347',blue:'#86ccff',parch:'#eadfc4',wood:'#4b3527'};
const V=(()=>{let v=[1,.875,1],l=Math.hypot(...v);return v.map(a=>a/l)})();const L=(()=>{let v=[.35,1,.75],l=Math.hypot(...v);return v.map(a=>a/l)})();
const rgb=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function rot(o){const cx=Math.cos(o.rx||0),sx=Math.sin(o.rx||0),cz=Math.cos(o.rz||0),sz=Math.sin(o.rz||0),cy=Math.cos(o.ry||0),sy=Math.sin(o.ry||0);
 return([x,y,z])=>{let a=y*cx-z*sx,b=y*sx+z*cx;y=a;z=b;a=x*cz-y*sz;b=x*sz+y*cz;x=a;y=b;a=x*cy+z*sy;b=-x*sy+z*cy;return[a,y,b]}}
class Mesh{constructor(){this.f=[];this.lines=[];this.glow=[]}
 add(p,col,o,c){let n=cross(sub(p[1],p[0]),sub(p[2],p[0]));let l=Math.hypot(...n)||1;n=n.map(a=>a/l);
  if(c){let m=p.reduce((s,q)=>[s[0]+q[0],s[1]+q[1],s[2]+q[2]],[0,0,0]).map(a=>a/p.length);if(dot(n,sub(m,c))<0)n=n.map(a=>-a)}
  this.f.push({p,c:rgb(col),e:o.e||0,d:o.d||0,n})}
 box(cx,cy,cz,w,h,d,col,o={}){const r=rot(o),C=[cx,cy,cz];w/=2;h/=2;d/=2;
  const v=[[-w,-h,-d],[w,-h,-d],[w,h,-d],[-w,h,-d],[-w,-h,d],[w,-h,d],[w,h,d],[-w,h,d]].map(q=>{q=r(q);return[q[0]+cx,q[1]+cy,q[2]+cz]});
  for(const f of[[0,3,2,1],[4,5,6,7],[0,4,7,3],[1,2,6,5],[3,7,6,2],[0,1,5,4]])this.add(f.map(i=>v[i]),col,o,C)}
 cyl(cx,cy,cz,r0,r1,len,n,col,o={}){const r=rot(o),k=o.k||1,C=[cx,cy,cz],T=[],B=[];
  for(let i=0;i<n;i++){let a=i/n*Math.PI*2+(o.a0||0),c=Math.cos(a),s=Math.sin(a);
   let b=r([c*r0,-len/2,s*r0*k]),t=r([c*r1,len/2,s*r1*k]);B.push([b[0]+cx,b[1]+cy,b[2]+cz]);T.push([t[0]+cx,t[1]+cy,t[2]+cz])}
  for(let i=0;i<n;i++){let j=(i+1)%n;this.add([B[i],B[j],T[j],T[i]],col,o,C)}
  if(r0>.001)this.add(B.slice().reverse(),col,o,C);if(r1>.001)this.add(T,col,o,C)}
 quad(p,col,o={}){this.add(p,col,{...o,d:1})}
 line(a,b,col,w){this.lines.push({a,b,col,w})}
 light(p,r,col){this.glow.push({p,r,col})}
 seg(a,b,r0,r1,n,col,o={}){const d=sub(b,a),l=Math.hypot(...d),w=d.map(x=>x/l);let up=Math.abs(w[1])<.9?[0,1,0]:[1,0,0];
  let u=cross(w,up),ul=Math.hypot(...u);u=u.map(x=>x/ul);const v=cross(w,u),ku=o.ku||1,kv=o.k||1,C=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],A=[],Bv=[];
  for(let i=0;i<n;i++){const t=i/n*Math.PI*2,c=Math.cos(t)*ku,q=Math.sin(t)*kv,dir=[u[0]*c+v[0]*q,u[1]*c+v[1]*q,u[2]*c+v[2]*q];
   A.push([a[0]+dir[0]*r0,a[1]+dir[1]*r0,a[2]+dir[2]*r0]);Bv.push([b[0]+dir[0]*r1,b[1]+dir[1]*r1,b[2]+dir[2]*r1])}
  for(let i=0;i<n;i++){const j=(i+1)%n;if(r1>.001)this.add([A[i],A[j],Bv[j],Bv[i]],col,o,C);else this.add([A[i],A[j],Bv[i]],col,o,C)}
  if(r0>.001)this.add(A.slice().reverse(),col,o,C);if(r1>.001)this.add(Bv,col,o,C)}}

/* ---------- builder commun « Saurus », paramétré par proposition ---------- */
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function shooter(m,t,s,O){
 const n=O.n,br=Math.sin(t*2.1)*.01,rec=s.rec*.1,fl=.85+.15*Math.sin(t*13)*Math.sin(t*7.3),B=O.bulk;
 const G=P.gun,S=P.steel,K=P.black,R=P.rust,Lh=P.leath,Ld='#3f2a1d',PI=Math.PI;
 const ws=O.wpn,th=Math.sqrt(ws),W=x=>x*ws-rec,y0=1.27;
 /* --- jambes --- */
 for(const sd of[-1,1]){const z=sd*.17;
  m.box(.03,.05,z,.36,.1,.17,K);m.box(-.12,.1,z,.1,.12,.15,G);
  for(let i=0;i<3;i++)m.box(.19-i*.07,.1+i*.025,z,.08,.05,.16,i%2?G:S,{rz:-.35});
  m.seg([0,.16,z],[0,.66,z],.1,.125,n,G);m.box(.1,.42,z,.05,.42,.15,S,{rz:.04});
  for(const y of[.26,.56])for(const q of[-1,1])m.box(.128,y,z+q*.05,.012,.02,.02,R);
  m.seg([.07,.7,z],[.18,.72,z],.095,.06,n,S);m.box(.1,.7,z+sd*.085,.06,.13,.04,G,{rx:sd*.2});
  m.seg([0,.74,z],[0,1.04,z*1.1],.13,.16,n,G);m.box(.13,.9,z,.05,.26,.17,S);
  if(O.thigh)m.box(.03,.88,z+sd*.13,.22,.24,.04,S,{rx:sd*.15});
 }
 m.box(.0,.82,-.33,.16,.18,.07,Lh);m.box(.0,.9,-.37,.17,.06,.02,Ld);m.cyl(0,.8,-.19,.165,.165,.035,n,Ld);
 /* --- tunique en lés ivoire / cramoisi --- */
 const tun=(a,w,y1,col,r1=.42)=>{const c=Math.cos(a),q=Math.sin(a),px=-q,pz=c,r0=.33,yt=1.02;
  m.quad([[c*r0-px*w,yt,(q*r0-pz*w)*.85],[c*r0+px*w,yt,(q*r0+pz*w)*.85],[c*r1+px*w*1.25,y1,(q*r1+pz*w*1.25)*.9],[c*r1-px*w*1.25,y1,(q*r1-pz*w*1.25)*.9]],col)};
 const T=O.tunY;
 tun(0,.15,T+.02,P.ivory,.4);tun(.08,.13,T+.12,P.crim,.39);
 for(const sd of[-1,1]){tun(sd*.85,.13,T+.12,P.crim);tun(sd*1.55,.12,T+.18,P.ivory);tun(sd*2.25,.14,T-.02,P.crim);tun(sd*2.8,.12,T-.08,P.ivory)}
 tun(PI,.18,T-.06,P.ivory,.44);
 /* --- torse --- */
 m.seg([0,1.04,0],[0,1.3,0],.27*B,.3*B,n,G,{k:.75});
 for(let i=0;i<3;i++)m.box(.21,1.13+i*.075,0,.08,.07,.34*B,i%2?G:S,{rz:.12});
 m.seg([0,1.3,0],[0,1.68+br,0],.32*B,.38*B,n,G,{k:.7});
 for(const sd of[-1,1]){m.box(.2,1.48+br,sd*.13*B,.14,.3,.26*B,S,{ry:-sd*.25,rz:.08});
  for(const y of[1.38,1.58])m.box(.278,y+br,sd*.2*B,.012,.02,.02,R);
  m.box(-.02,1.82+br,sd*.13,.18,.12,.03,G,{rx:sd*.3})}
 m.box(.29,1.48+br,0,.03,.3,.035,R);m.box(-.22,1.45+br,0,.1,.38,.5*B,G,{rz:-.06});
 m.seg([0,1.66+br,0],[0,1.8+br,0],.2,.15,n,S);
 /* --- ceinturon et sacoches --- */
 m.seg([0,1.0,0],[0,1.09,0],.33*B,.33*B,n+4,Lh,{k:.8});m.box(.33*B+.01,1.045,0,.03,.08,.1,P.brass);
 for(const a of[.55,-.55,1.15,-1.15,2.0,-2.0]){const c=Math.cos(a),q=Math.sin(a),px=c*.34*B,pz=q*.34*B*.8;
  m.box(px,.99,pz,.1,.15,.13,Lh,{ry:-a});m.box(px+c*.012,1.06,pz+q*.012,.11,.05,.14,Ld,{ry:-a});m.box(px+c*.06,1.03,pz+q*.05,.01,.025,.02,P.brass,{ry:-a})}
 /* --- épaulières à lames --- */
 for(const sd of[-1,1]){const sx=0,sy=1.68+br,sz=sd*.42*B;
  for(let i=0;i<O.lames;i++)m.cyl(sx,sy-i*.075,sz+sd*i*.035,(.1+i*.015)*O.pd,(.15+i*.015)*O.pd,.09,n,i%2?S:G,{rx:sd*(.3+i*.08)});
  m.cyl(sx,sy+.07,sz,.12*O.pd,.05,.07,n,G,{rx:sd*.3});
  if(O.mantle)m.quad([[-.1,sy+.08,sd*.12],[-.1,sy+.08,sz],[-.3,sy-.6,sz*1.15],[-.32,sy-.6,sd*.1]],P.crim)}
 /* --- bras (prise de l'arbalète) --- */
 const hands=[[W(.27),y0-.12*th,-.05],[W(.72),y0-.1*th,.06]];
 [[-1,[.06,1.24,-.38*B]],[1,[.28,1.3,.4*B]]].forEach(([sd,el],k)=>{const sh=[0,1.62+br,sd*.4*B],h=hands[k];
  m.seg(sh,el,.09,.08,n,K);m.seg(lerp(sh,el,.25),lerp(sh,el,.8),.105,.095,n,G);
  m.cyl(el[0],el[1],el[2],.075,.075,.1,n,S,{rx:PI/2});
  m.seg(lerp(el,h,.12),lerp(el,h,.78),.085,.068,n,S);m.seg(lerp(el,h,.7),lerp(el,h,.84),.09,.1,n,G);
  m.box(h[0],h[1],h[2],.11,.1,.1,K);m.box(h[0],h[1]+.055,h[2],.1,.03,.09,G);
  for(let f=0;f<4;f++)m.box(h[0]+.04,h[1]-.04,h[2]-.035+f*.023,.04,.05,.02,K)});
 /* --- casque saurus (face fermée) --- */
 const hy=1.97+br;
 m.seg([-.13,hy-.01,0],[.06,hy,0],.15,.15,n,G,{k:.9});
 m.seg([.04,hy-.03,0],[.25,hy-.08,0],.13,.06,n,G,{k:.85});
 m.seg([.02,hy-.12,0],[.21,hy-.16,0],.1,.045,6,S,{k:.9});
 for(const sd of[-1,1]){for(let i=0;i<3;i++)m.box(.12+i*.035,hy-i*.01,sd*.083,.026,.012,.012,K);
  m.box(.0,hy-.06,sd*.14,.19,.13,.03,S,{ry:sd*.2});m.box(.02,hy+.05,sd*.13,.12,.04,.03,R,{ry:sd*.2});
  for(let i=0;i<O.side;i++)m.seg([-.04-i*.06,hy+.03-i*.03,sd*.13],[-.24-i*.06,hy+.12-i*.02,sd*(.2+i*.02)],.045,0,4,i%2?S:G,{ku:.3})}
 for(let i=0;i<O.crest;i++){const x=.12-i*.065,y=hy+.11+(i<2?-.02*(2-i):0),L=.22*(1-i*.07)*O.crestS;
  m.seg([x,y,0],[x-.13*O.crestS,y+L,0],.07,0,4,i%2?S:G,{ku:.45})}
 if(O.hoodcloth)m.quad([[-.12,hy+.1,-.15],[-.12,hy+.1,.15],[-.3,hy-.5,.3],[-.3,hy-.5,-.3]],P.crim);
 /* --- arbalète à répétition lourde --- */
 m.box(W(.02),y0,0,.18*ws,.13*th,.07*th,G);m.box(W(-.075),y0-.02,0,.035*ws,.17*th,.08*th,K);m.box(W(.15),y0+.02,0,.12*ws,.06*th,.06*th,G);
 m.box(W(.27),y0-.1*th,0,.05,.16*th,.05,K,{rz:-.25});
 m.box(W(.43),y0+.02,0,.36*ws,.11*th,.1*th,G);m.box(W(.43),y0+.01,0,.28*ws,.05*th,.104*th,R);
 m.box(W(.56),y0+.09*th,0,.62*ws,.025*th,.05*th,K);for(let i=0;i<7;i++)m.box(W(.3+i*.07),y0+.108*th,0,.018,.015,.056*th,G);
 const sc=O.scope;m.box(W(.45),y0+.16*th,0,.18*ws*sc,.07*th,.07*th,K);m.box(W(.39),y0+.115*th,0,.03,.04,.04,G);m.box(W(.51),y0+.115*th,0,.03,.04,.04,G);
 m.box(W(.45)+.09*ws*sc+.006,y0+.16*th,0,.012,.05*th,.05*th,P.amber,{e:fl});
 m.box(W(.6),y0+.05*th,.07*th,.14*ws,.04,.02,S);m.box(W(.66),y0+.05*th,.085*th,.03,.06,.03,K);
 const dr=.14*th*O.drum,dx=W(.45),dy=y0-.13*th-(O.drum-1)*.1;
 m.cyl(dx,dy,0,dr,dr,.16*th,14,G,{rx:PI/2});m.cyl(dx,dy,0,.03,.03,.18*th,8,K,{rx:PI/2});
 for(let i=0;i<8;i++){const a=i/8*PI*2;m.box(dx+Math.cos(a)*dr,dy+Math.sin(a)*dr,0,.022,.022,.17*th,S,{rz:a})}
 for(const sd of[-1,1])for(let i=0;i<4;i++)m.box(dx,dy-.075*th*O.drum+i*.05*th*O.drum,sd*.081*th,dr*1.15,.018*th,.004,P.amber,{e:fl});
 m.light([dx,dy,.1],.22*th,'255,170,70');m.light([dx,dy,-.1],.22*th,'255,170,70');
 m.box(W(.8),y0,0,.3*ws,.08*th,.09*th,G);m.box(W(.72),y0-.1*th,0,.05,.14*th,.05,K);
 if(O.long)m.box(W(1.12),y0+.02,0,.35*ws,.05*th,.05*th,K);
 const rx=W(.98);m.box(rx,y0+.02,0,.08,.15*th,.17*th,G);m.box(rx+.045,y0+.02,0,.01,.1*th,.12*th,R);
 for(const sd of[-1,1]){const p0=[rx,y0+.02,sd*.08*th],p1=[rx+.03,y0+.02,sd*.26*ws],p2=[rx-.04,y0+.02,sd*.42*ws],p3=[rx-.15*ws,y0+.02,sd*.52*ws];
  m.seg(p0,p1,.04*th,.036*th,6,G,{k:.55});m.seg(p1,p2,.036*th,.03*th,6,G,{k:.55});m.seg(p2,p3,.03*th,.025*th,6,G,{k:.55});
  m.box(...lerp(p0,p1,.5),.06,.07*th,.08,S,{ry:-sd*.2});m.box(...lerp(p1,p2,.5),.05,.06*th,.07,R,{ry:sd*.4});
  m.cyl(p3[0],p3[1],p3[2],.035,.035,.07,8,S);
  m.line(p3,[W(.6)+s.rec*.08,y0+.06*th,0],'#d4c7a6',1.6);
  m.seg(lerp(p0,p1,.6),[W(.82),y0-.05*th,sd*.04],.012,.012,4,K)}
 if(s.rec<.5){const by=y0+.07*th;m.seg([W(.62),by,0],[W(1.0),by,0],.012,.012,4,S);
  for(const sd of[-1,1])m.quad([[W(.62),by,0],[W(.7),by,0],[W(.6),by+.03,sd*.03],[W(.58),by+.03,sd*.03]],P.ivory);
  m.seg([W(1.0),by,0],[W(1.08),by,0],.028*th,.03*th,6,K);m.seg([W(1.08),by,0],[W(1.15),by,0],.03*th,0,6,P.amber,{e:1});m.light([W(1.12),by,0],.16*th,'255,190,90')}
}
const DEF={
 A:{name:'A · Saurus réglementaire',pitch:['Casque saurus fermé, crête à 5 ailerons','Plates segmentées, rivets et bords rouillés','Tunique en lés ivoire / cramoisi, 6 sacoches','Arbalète lourde : tambour, viseur, branches renforcées'],
  o:{n:10,bulk:1,pd:1,lames:3,crest:5,crestS:1,side:0,tunY:.32,wpn:1.3,drum:1,scope:1}},
 B:{name:'B · Saurus d’assaut (blindé)',pitch:['Crête haute + ailerons latéraux','Épaulières à 4 lames, plaques de cuisse','Gabarit massif','Arbalète ×1,5 à tambour surdimensionné'],
  o:{n:10,bulk:1.15,pd:1.25,lames:4,crest:6,crestS:1.3,side:2,thigh:1,tunY:.38,wpn:1.5,drum:1.3,scope:1}},
 C:{name:'C · Saurus éclaireur (longue portée)',pitch:['Crête basse, capuchon de tissu cramoisi','Mantelet sur les épaules, tunique longue','Silhouette plus fine','Arbalète longue : canon prolongé, grand viseur'],
  o:{n:10,bulk:.95,pd:.85,lames:2,crest:3,crestS:.8,side:1,mantle:1,hoodcloth:1,tunY:.16,wpn:1.4,drum:.85,scope:1.6,long:1}}};

/* ---------- rendu (même projection que le jeu) ---------- */
function render(ctx,W,H,mesh,yaw,scale){
 const cy=Math.cos(yaw),sy=Math.sin(yaw),R=p=>[p[0]*cy+p[2]*sy,p[1],-p[0]*sy+p[2]*cy];
 const pr=p=>({x:W/2+(p[0]-p[2])*scale*.86,y:H*.78+(p[0]+p[2])*scale*.42-p[1]*scale*.96});
 // ombre
 ctx.fillStyle='#0b0c0e99';ctx.beginPath();ctx.ellipse(W/2,H*.78,.8*scale*.9,.8*scale*.42,0,0,Math.PI*2);ctx.fill();
 const items=[];
 for(const f of mesh.f){let n=R(f.n),v=dot(n,V);if(!f.d&&v<=0)continue;if(v<0)n=n.map(a=>-a);
  const p=f.p.map(R);let dz=0;for(const q of p)dz+=dot(q,V);items.push({t:0,p,z:dz/p.length,f,n})}
 for(const l of mesh.lines){const a=R(l.a),b=R(l.b);items.push({t:1,a,b,l,z:(dot(a,V)+dot(b,V))/2+.01})}
 items.sort((a,b)=>a.z-b.z);
 for(const it of items){if(it.t){const a=pr(it.a),b=pr(it.b);ctx.strokeStyle=it.l.col;ctx.lineWidth=it.l.w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();continue}
  const f=it.f,k=f.e?f.e:.38+.62*Math.max(0,dot(it.n,L))+.12*Math.max(0,-it.n[1]*0);
  ctx.fillStyle=`rgb(${f.c.map(c=>Math.min(255,c*k)|0)})`;ctx.beginPath();it.p.forEach((q,i)=>{q=pr(q);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fill();
  ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.6;ctx.stroke();ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=.5;ctx.stroke()}
 ctx.globalCompositeOperation='lighter';
 for(const g of mesh.glow){const q=pr(R(g.p)),r=g.r*scale;const gr=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,r);gr.addColorStop(0,`rgba(${g.col},.55)`);gr.addColorStop(1,`rgba(${g.col},0)`);ctx.fillStyle=gr;ctx.fillRect(q.x-r,q.y-r,r*2,r*2)}
 ctx.globalCompositeOperation='source-over';return items.length}

const cards=[];
for(const key of['A','B','C']){const d=DEF[key],el=document.createElement('div');el.className='card';
 el.innerHTML=`<canvas></canvas><div class="b"><h2>${d.name}</h2><ul>${d.pitch.map(x=>`<li>${x}</li>`).join('')}</ul><div class="meta"></div></div>`;
 document.getElementById('grid').appendChild(el);
 const c={key,d,cv:el.querySelector('canvas'),meta:el.querySelector('.meta'),yaw:-.6,drag:null,rec:0};
 c.cv.addEventListener('pointerdown',e=>{c.drag=e.clientX;c.cv.setPointerCapture(e.pointerId)});
 c.cv.addEventListener('pointermove',e=>{if(c.drag!=null){c.yaw+=(e.clientX-c.drag)*.01;c.drag=e.clientX}});
 c.cv.addEventListener('pointerup',()=>c.drag=null);cards.push(c)}
document.getElementById('fire').onclick=()=>cards.forEach(c=>c.rec=1);
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 const spin=document.getElementById('spin').checked,zoom=+document.getElementById('zoom').value/100,inGame=document.getElementById('game').checked;
 for(const c of cards){const dpr=Math.min(devicePixelRatio||1,2),W=c.cv.clientWidth,H=c.cv.clientHeight;
  if(c.cv.width!==Math.round(W*dpr)){c.cv.width=Math.round(W*dpr);c.cv.height=Math.round(H*dpr)}
  const ctx=c.cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(spin&&c.drag==null)c.yaw+=dt*.5;c.rec=Math.max(0,c.rec-dt*2.5);
  const m=new Mesh();shooter(m,t,{rec:c.rec},c.d.o);
  const scale=inGame?Math.min(innerWidth/83,innerHeight/54):140*zoom;
  const nf=render(ctx,W,H,m,c.yaw,scale);
  if(c.rec>.85){ctx.fillStyle='#ffd27a';ctx.font='12px Georgia';ctx.fillText('✦ carreau explosif',W/2+40,H*.3)}
  c.meta.textContent=`${m.f.length} faces · ${nf} dessinées · ${m.glow.length} halos lumineux`}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
